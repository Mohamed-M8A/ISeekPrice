name: ISeekPrice
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Build Engine (Merge Binary Files)"]
    types: [completed]
jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 🧹 Industrial Cleaning
        run: |
          echo -e "\033[1;34m🔵 [SYSTEM] Starting environment cleanup...\033[0m"
          rm -rf _site .cache
          mkdir _site
      - name: 📦 Install Dependencies
        run: |
          echo -e "\033[1;34m🔵 [NPM] Installing core dependencies...\033[0m"
          npm install --no-fund --no-audit
      - name: 🚀 Production Build Loop
        id: build_loop
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "### 📊 Industrial Build Report" >> $GITHUB_STEP_SUMMARY
          echo "| Country | Status | Build Time | Total Pages | Avg. Speed/Page |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          declare -A flags=( [SA]="🇸🇦" [AE]="🇦🇪" [OM]="🇴🇲" [MA]="🇲🇦" [DZ]="🇩🇿" [TN]="🇹🇳" )
          TOTAL_PAGES=162
          for country in SA AE OM MA DZ TN; do
            echo "::group::🔵 Processing Target: $country"
            
            start_time=$(date +%s%N)
            
            COUNTRY=$country npx @11ty/eleventy --output=_site/${country,,} --quiet
            
            end_time=$(date +%s%N)
            
            duration_ns=$((end_time - start_time))
            duration_ms=$((duration_ns / 1000000))
            duration_s=$(echo "scale=2; $duration_ms / 1000" | bc)
            
            avg_page_ms=$(echo "scale=2; $duration_ms / $TOTAL_PAGES" | bc)
            echo -e "\033[1;32m✅ Completed $country in ${duration_s}s\033[0m"
            
            echo "| ${flags[$country]} $country | ✅ Success | ${duration_s}s | $TOTAL_PAGES | ${avg_page_ms}ms |" >> $GITHUB_STEP_SUMMARY
            
            echo "::endgroup::"
          done
      - name: 🌎 Build Global Root
        run: |
          echo "::group::🔵 Building Global Root"
          COUNTRY=SA npx @11ty/eleventy --output=_site/root --quiet
          echo "| 🌎 ROOT | ✅ Success | -- | -- | -- |" >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
      - name: 🛡️ Post-Build Optimization
        run: |
          echo -e "\033[1;34m🔵 [CLEANUP] Removing build artifacts...\033[0m"
          find _site -type d -name ".cache" -exec rm -rf {} +
          find _site -type f -name ".DS_Store" -exec rm -f {} +
      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.R2_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          projectName: 'iseekprice'
          directory: '_site'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏁 Final Summary
        run: |
          echo -e "\033[1;32m✅ INDUSTRIAL BUILD COMPLETED SUCCESSFULLY\033[0m"
          echo "Build detailed report is available in the Workflow Summary tab."
