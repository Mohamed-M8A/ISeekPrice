name: ISeekPrice Industrial Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🧹 Industrial Cleaning
        run: |
          rm -rf _site
          rm -rf .cache
          mkdir _site

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Build Subdomains Loop
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          declare -A flags=( [SA]="🇸🇦" [AE]="🇦🇪" [OM]="🇴🇲" [MA]="🇲🇦" [DZ]="🇩🇿" [TN]="🇹🇳" )
          for country in SA AE OM MA DZ TN; do
            echo "--------------------------------------------------"
            echo "⚡ [BUILDING] Starting production generation..."
            echo "${flags[$country]} Country Target: $country"
            echo "--------------------------------------------------"
            COUNTRY=$country npx @11ty/eleventy --output=_site/${country,,}
          done

      - name: 👑 Build Default Root
        run: COUNTRY=SA npx @11ty/eleventy --output=_site/root

      - name: 🛡️ Final Site Structure Cleanup
        run: |
          find _site -type d -name ".cache" -exec rm -rf {} +
          find _site -type f -name ".DS_Store" -exec rm -f {} +

      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.R2_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          projectName: 'iseekprice'
          directory: '_site'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
