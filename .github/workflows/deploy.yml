name: ISeekPrice Industrial Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build All Countries
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for country in SA AE OM MA DZ TN; do
            echo "Building for $country..."
            COUNTRY=$country npx @11ty/eleventy --output=_site/${country,,}
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.R2_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          projectName: 'iseekprice'
          directory: '_site'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
