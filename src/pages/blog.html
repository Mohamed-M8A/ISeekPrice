<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة ISeekPrice</title>
    <style>
        :root { --primary: #2d3436; --bg: #f9f9f9; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .blog-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .post-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; text-decoration: none; color: inherit; }
        .post-card:hover { transform: translateY(-5px); }
        .post-card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .post-card h2 { padding: 15px; margin: 0; font-size: 1.1rem; line-height: 1.4; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 40px;">آخر المقالات</h1>

    <div id="blog-grid" class="blog-container">
        <!-- المقالات ستظهر هنا -->
    </div>

    <script>
        async function loadBlog() {
            const MEDIA_BASE = "https://media.iseekprice.com/";
            const JSON_URL = "https://data.iseekprice.com/General/post.json";

            try {
                const response = await fetch(`${JSON_URL}?v=${Date.now()}`);
                const posts = await response.json();
                const grid = document.getElementById('blog-grid');

                grid.innerHTML = posts.map(post => `
                    <a href="/post/${post.Url}" class="post-card">
                        <img src="${MEDIA_BASE}${post.Img}" alt="${post.Title}" loading="lazy">
                        <h2>${post.Title}</h2>
                    </a>
                `).join('');
            } catch (error) {
                console.error("خطأ في تحميل المدونة:", error);
            }
        }

        loadBlog();
    </script>
</body>
</html>
