<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة ISeekPrice - أحدث المراجعات والأسعار</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
    <link href='/public/css/style.min.css' rel='stylesheet'/> 
    <style>
        :root{--navy:#001f3f;--navy-light:#1e3a8a;--border:#e2e8f0}.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:25px;padding:30px 0}.post-card{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.05);text-decoration:none;color:inherit;display:flex;flex-direction:column;border:1px solid var(--border);border-bottom:4px solid var(--navy)}.img-container{width:100%;height:190px;background:#f1f5f9;overflow:hidden}.post-card img{width:100%;height:100%;object-fit:cover}.post-content{padding:15px;flex-grow:1}.post-date{font-size:.8rem;color:#64748b;margin-bottom:8px;display:block}.post-card h2{font-size:1.05rem;margin:0;line-height:1.5;font-weight:700;color:var(--navy)}.search-section{display:flex;align-items:center;justify-content:center;gap:10px;margin:30px 0}.search-box{position:relative;width:100%;max-width:400px}.search-box input{width:100%;padding:12px 15px;border:2px solid var(--border);border-radius:4px;font-family:inherit;outline:none;transition:border-color .2s}.search-box input:focus{border-color:var(--navy)}.search-btn{background:var(--navy);color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}.search-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dark-mode .post-card{background:#1e293b;border-color:#334155;border-bottom-color:var(--navy-light);color:#f1f5f9}.dark-mode .post-card h2{color:#f1f5f9}.dark-mode .post-card img{opacity:.8}.dark-mode .search-box input{background:#0f172a;border-color:#334155;color:#fff}#primary{max-width:1200px;margin:0 auto;padding:0 20px}.blog-header{text-align:center;margin-top:40px}.blog-header h1{font-size:2.2rem;color:var(--navy);margin-bottom:10px}.dark-mode .blog-header h1{color:#f1f5f9}
    </style>
</head>
<body>

<header id='header' itemscope='itemscope' itemtype='https://schema.org/WPHeader'>
  <div class='header-main-row'>
    <div class='header-container'>
      <div class='logo' id='logo-wrap'></div>
      <div class='search-container' id='search-wrap'></div>
      <div class='header-actions' id='actions-wrap'></div>
    </div>
  </div>
  <nav id='widget-topbar'></nav>
</header>

<div id='widget-sidebar'></div>
<div id='widget-overlay'></div>

<div id='primary'>
    <main>
        <div class="blog-header">
            <h1>المدونة</h1>
            <p>تحليلات حصرية لآخر تطورات السوق والأسعار</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="blog-search-input" placeholder="ابحث في المقالات أو التاريخ...">
            </div>
            <button class="search-btn">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>

        <div id="blog-root" class="blog-grid"></div>
    </main>
</div>

<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>

<script defer src='/public/js/corepress.js'></script>   
<script defer src='/public/js/search.js'></script>

<script>
    let allPosts = [];
    const root = document.getElementById('blog-root');
    const searchInput = document.getElementById('blog-search-input');

    function parseDate(url) {
        const p = url.split('/');
        if (p.length >= 3) {
            const months = ["يناير", "فبراير", "مارس", "إبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
            return `${parseInt(p[2])} ${months[parseInt(p[1]) - 1]} ${p[0]}`;
        }
        return "";
    }

    function displayPosts(posts) {
        if (posts.length === 0) {
            root.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:50px;">لا توجد نتائج مطابقة لبحثك.</p>';
            return;
        }
        root.innerHTML = posts.map(post => `
            <a href="/post/${post.Url}.html" class="post-card">
                <div class="img-container">
                    <img src="${post.Img ? 'https://media.iseekprice.com/' + post.Img : '/public/assets/static/no-image.png'}" alt="${post.Title}" loading="lazy">
                </div>
                <div class="post-content">
                    <span class="post-date">${parseDate(post.Url)}</span>
                    <h2>${post.Title}</h2>
                </div>
            </a>
        `).join('');
    }

    async function init() {
        try {
            const res = await fetch(`https://data.iseekprice.com/General/posts.json?v=${Date.now()}`);
            allPosts = await res.json();
            allPosts.reverse();
            displayPosts(allPosts);
        } catch (e) {
            root.innerHTML = '<p style="text-align:center;">عذراً، فشل الاتصال بخادم البيانات.</p>';
        }
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allPosts.filter(post => 
            post.Title.toLowerCase().includes(query) || 
            post.Url.includes(query)
        );
        displayPosts(filtered);
    });

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
