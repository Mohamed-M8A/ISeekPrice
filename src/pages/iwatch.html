<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="iWatch">
    <meta property="og:title" content="iWatch - شاهد أفضل الفيديوهات للمنتجات الرائجة">
    <meta property="og:description" content="تصفح واكتشف أفضل المنتجات والخصومات الحصرية عبر مقاطع فيديو سريعة.">
    <meta property="og:image" content="https://www.iseekprice.com/public/assets/static/iwatch.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="iWatch - شاهد أفضل الفيديوهات للمنتجات الرائجة">
    <meta name="twitter:image" content="https://www.iseekprice.com/public/assets/static/iwatch.png">
    <title>iWatch - شاهد افضل الفيديوهات للمنتجات الرائجة</title>
    <link rel="icon" type="image/png" href="/public/assets/static/iwatch.webp">

    
<style>
    
:root{--bg:#050505;--card-bg:#0d0d0d;--primary:#f38020;--accent:#0070f3;--text:#ffffff;--glass:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1)}*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}::-webkit-scrollbar{display:none}body{background-color:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;direction:rtl;overflow-x:hidden}.site-header{position:sticky;top:0;z-index:100;background:rgb(5 5 5 / .8);backdrop-filter:blur(12px);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.logo-group{display:flex;align-items:center;gap:8px;cursor:pointer}.header-logo-img{width:26px;height:26px;object-fit:contain}.logo-txt{font-weight:800;font-size:1.2rem;color:var(--primary);letter-spacing:-.5px}.back-link{color:var(--text);text-decoration:none;font-size:11px;font-weight:600;background:var(--accent);padding:5px 12px;border-radius:15px}.tabs-nav{display:flex;justify-content:center;gap:8px;padding:12px;background:var(--bg)}.tab-btn{background:none;border:none;color:#888;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;border-radius:20px;transition:0.2s}.tab-btn.active{background:var(--glass);color:var(--primary);box-shadow:inset 0 0 0 1px rgb(243 128 32 / .3)}.v-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px;max-width:1400px;margin:0 auto}@media(min-width:768px){.v-grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1200px){.v-grid{grid-template-columns:repeat(6,1fr)}}.grid-card{position:relative;aspect-ratio:9/16;background:var(--card-bg);overflow:hidden;cursor:pointer;border:1px solid var(--border)}.grid-card img{width:100%;height:100%;object-fit:cover}.g-badge{position:absolute;top:6px;right:6px;background:var(--primary);color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:800;z-index:5}.g-title{position:absolute;bottom:0;left:0;width:100%;padding:8px;background:linear-gradient(to top,rgb(0 0 0 / .9),transparent);font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hidden-view{display:none}.feed-container{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;max-width:480px;margin:0 auto;background:#000}.video-card{position:relative;width:100%;height:100dvh;scroll-snap-align:start;overflow:hidden}.video-card video{width:100%;height:100%;object-fit:cover;z-index:1}.v-bg-skeleton{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px);opacity:.2;z-index:0}.v-state-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;width:60px;height:60px;background:rgb(0 0 0 / .3);border-radius:50%;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:0.3s}.v-state-overlay.active{opacity:1;transform:translate(-50%,-50%) scale(1.1)}.v-state-overlay svg{width:30px;height:30px;fill:#fff}.v-top-bar{position:absolute;top:0;left:0;width:100%;padding:15px;z-index:20;display:flex;justify-content:space-between;align-items:center}.v-mute-btn,.v-close-btn{background:rgb(0 0 0 / .5);backdrop-filter:blur(8px);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}.v-mute-btn svg,.v-close-btn svg{width:16px;height:16px;fill:#fff}.v-overlay{position:absolute;bottom:0;left:0;width:100%;padding:20px 15px;background:linear-gradient(to top,rgb(0 0 0 / .95) 20%,transparent 100%);z-index:10}.v-details{display:flex;flex-direction:column;gap:8px}.v-order-info{color:var(--primary);font-size:11px;font-weight:800}.v-title{font-size:14px;font-weight:600;line-height:1.4;text-shadow:0 1px 3px #000}.v-actions{display:flex;align-items:center;gap:10px;margin-top:10px}.btn-order{flex:1;background:var(--primary);color:#fff;text-decoration:none;text-align:center;padding:10px;border-radius:8px;font-weight:700;font-size:13px}.btn-fav,.btn-share{background:var(--glass);border:1px solid var(--border);color:#fff;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}.btn-fav svg,.btn-share svg{width:18px;height:18px;fill:#fff}.btn-fav.active svg,.btn-fav.active svg use{fill:#ef4444!important;color:#ef4444!important}.v-progress-container{width:100%;height:12px;margin-top:12px;cursor:pointer;display:flex;align-items:center;position:relative;z-index:15}.v-progress-bar{height:3px;background:var(--primary);width:0%;border-radius:2px;transition:width 0.1s linear;pointer-events:none}

</style>
    
</head>
<body>

    <div id="gridUI">
        <header class="site-header">
            <div class="logo-group" onclick="location.href='?'">
                <img src="/public/assets/static/iwatch.png" alt="logo" class="header-logo-img">
                <span class="logo-txt">iWatch</span>
            </div>
            <a href="https://www.iseekprice.com" class="back-link">العودة للرئيسية</a>
        </header>
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="app.switchTab('all', this)">الكل</button>
            <button class="tab-btn" onclick="app.switchTab('likes', this)">المفضلة</button>
        </nav>
        <main class="v-grid" id="mainGrid"></main>
    </div>

    <div id="feedUI" class="hidden-view">
        <div class="feed-container" id="verticalFeed"></div>
    </div>

<script>
const CONFIG = {
    DATA: "https://data.iseekprice.com/General/videos.json",
    VIDEO: "https://video.iseekprice.com/",
    MEDIA: "https://media.iseekprice.com/",
    DOMAIN: "https://www.iseekprice.com/",
    ICONS: "/public/assets/static/icons.svg"
};

const Storage = {
    getLikes: () => JSON.parse(localStorage.getItem('fav_vids') || '[]'),
    toggleLike: (uid) => {
        let likes = Storage.getLikes();
        const idx = likes.indexOf(String(uid));
        if (idx > -1) likes.splice(idx, 1); else likes.push(String(uid));
        localStorage.setItem('fav_vids', JSON.stringify(likes));
        return idx === -1;
    }
};

const Utils = {
    toHex: (u) => BigInt(u).toString(16),
    fromHex: (h) => {
        try { return BigInt("0x" + h).toString(); }
        catch(e) { return null; }
    },
    getParam: (p) => new URLSearchParams(window.location.search).get(p),
    setParam: (v) => {
        const url = v ? `?v=${v}` : window.location.pathname;
        window.history.replaceState({}, '', url);  
    }
};

let audioState = { isMuted: false, volume: 0.5 };

function syncGlobalAudio() {
    document.querySelectorAll('video').forEach(v => {
        v.muted = audioState.isMuted;
        v.volume = audioState.volume;
    });
    document.querySelectorAll('.v-mute-btn svg use').forEach(u => {
        u.setAttribute('href', `${CONFIG.ICONS}${audioState.isMuted ? '#i-volume-off' : '#i-volume-on'}`);
    });
}

const app = {
    allData: [],
    activeTab: 'all',
    originalTitle: document.title,
    observer: null,

    async init() {
        try {
            const res = await fetch(`${CONFIG.DATA}?v=${Date.now()}`);
            this.allData = await res.json();
            this.render();
            window.addEventListener('popstate', () => this.render());
        } catch (e) { console.error(e); }
    },

    render() {
        const vHex = Utils.getParam('v');
        if (vHex) {
            const uid = Utils.fromHex(vHex);
            const exists = uid ? this.allData.find(i => String(i.uid) === String(uid)) : null;
            if (exists) {
                this.showFeed(uid);
            } else {
                Utils.setParam(null);
                document.title = this.originalTitle;
                this.showGrid();
            }
        } else {
            document.title = this.originalTitle;
            this.showGrid();
        }
    },

    showGrid() {
        document.getElementById('gridUI').style.display = 'block';
        document.getElementById('feedUI').style.display = 'none';
        const container = document.getElementById('mainGrid');
        container.innerHTML = '';
        
        let list = this.activeTab === 'likes' ? this.allData.filter(i => Storage.getLikes().includes(String(i.uid))) : this.allData;
        
        list.forEach(item => {
            const card = document.createElement('a');
            const hexParam = Utils.toHex(item.uid);
            card.className = 'grid-card';
            card.href = `?v=${hexParam}`;
            card.innerHTML = `<div class="g-badge">${item.orders} طلب</div><img src="${CONFIG.MEDIA}${item.tPath}.webp" loading="lazy"><div class="g-title">${item.title}</div>`;
            card.onclick = (e) => { 
                e.preventDefault(); 
                Utils.setParam(hexParam); 
                this.render(); 
            };
            container.appendChild(card);
        });
    },

    showFeed(targetUid) {
        document.getElementById('gridUI').style.display = 'none';
        document.getElementById('feedUI').style.display = 'block';
        const container = document.getElementById('verticalFeed');
        container.innerHTML = '';
        
        let list = [...this.allData];
        const idx = list.findIndex(i => String(i.uid) === String(targetUid));
        if (idx > -1) {
            const targetItem = list.splice(idx, 1)[0];
            list.unshift(targetItem);
        }
        
        list.forEach(item => container.appendChild(this.createFullCard(item)));
        
        if (this.observer) this.observer.disconnect();

        this.observer = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                const v = e.target.querySelector('video');
                if (e.isIntersecting) {
                    v.preload = "auto";
                    v.play().catch(()=>{}); 
                    syncGlobalAudio(); 
                    
                    const currentUid = e.target.getAttribute('data-uid');
                    const currentTitle = e.target.getAttribute('data-title');
                    document.title = `${currentTitle} - iWatch`;
                    Utils.setParam(Utils.toHex(currentUid));

                    let next1 = e.target.nextElementSibling;
                    if (next1) {
                        let v1 = next1.querySelector('video');
                        v1.preload = "auto";
                        let next2 = next1.nextElementSibling;
                        if (next2) next2.querySelector('video').preload = "auto";
                    }
                } else {
                    v.pause();
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.video-card').forEach(c => this.observer.observe(c));
        
        if(list[0]) document.title = `${list[0].title} - iWatch`;
    },

    createFullCard(item) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.setAttribute('data-uid', item.uid);
        card.setAttribute('data-title', item.title);
        
        const isLiked = Storage.getLikes().includes(String(item.uid));
        card.innerHTML = `
            <div class="v-top-bar">
                <div class="v-mute-btn" onclick="app.toggleMute(event)"><svg><use href="${CONFIG.ICONS}${audioState.isMuted ? '#i-volume-off' : '#i-volume-on'}"/></svg></div>
                <div class="v-close-btn" onclick="app.closeFeed()"><svg><use href="${CONFIG.ICONS}#i-close"/></svg></div>
            </div>
            <div class="v-state-overlay"><svg><use href="${CONFIG.ICONS}#i-play"/></svg></div>
            <div class="v-bg-skeleton" style="background-image:url(${CONFIG.MEDIA}${item.tPath}.webp)"></div>
            <video src="${CONFIG.VIDEO}${item.vFile}.mp4" poster="${CONFIG.MEDIA}${item.tPath}.webp" loop playsinline muted preload="metadata"></video>
            <div class="v-overlay">
                <div class="v-details">
                    <div class="v-order-info">${item.orders} طلب مؤكد</div>
                    <h2 class="v-title">${item.title}</h2>
                    <div class="v-actions">
                        <a href="${CONFIG.DOMAIN}${item.path}" target="_blank" class="btn-order" onclick="event.stopPropagation()">معاينة العرض</a>
                        <button class="btn-fav ${isLiked ? 'active' : ''}" onclick="app.handleLike(event, this, '${item.uid}')"><svg><use href="${CONFIG.ICONS}#i-heart"/></svg></button>
                        <button class="btn-share" onclick="app.handleShare(event, '${item.uid}', '${item.title}')"><svg><use href="${CONFIG.ICONS}#i-share-node"/></svg></button>
                    </div>
                </div>
                <div class="v-progress-container" onclick="app.handleSeek(event, this)">
                    <div class="v-progress-bar"></div>
                </div>
            </div>
        `;
        
        const v = card.querySelector('video'), overlay = card.querySelector('.v-state-overlay'), p = card.querySelector('.v-progress-bar');
        card.onclick = () => {
            const use = overlay.querySelector('svg use');
            if(v.paused) { v.play(); use.setAttribute('href', `${CONFIG.ICONS}#i-play`); } 
            else { v.pause(); use.setAttribute('href', `${CONFIG.ICONS}#i-pause`); }
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 500);
        };
        v.ontimeupdate = () => { 
            const percent = (v.currentTime / v.duration) * 100;
            p.style.width = `${percent}%`; 
        };
        return card;
    },

    handleSeek(e, container) {
        e.stopPropagation();
        const v = container.closest('.video-card').querySelector('video');
        const rect = container.getBoundingClientRect();
        const pos = (rect.right - e.clientX) / rect.width;
        v.currentTime = pos * v.duration;
    },

    toggleMute(e) { 
        e.stopPropagation(); 
        audioState.isMuted = !audioState.isMuted; 
        syncGlobalAudio(); 
    },

    handleLike(e, btn, uid) { 
        e.stopPropagation(); 
        btn.classList.toggle('active', Storage.toggleLike(uid)); 
    },

    handleShare(e, uid, title) {
        e.stopPropagation();
        const url = `${window.location.origin}${window.location.pathname}?v=${Utils.toHex(uid)}`;
        if (navigator.share) navigator.share({ title, url });
        else { navigator.clipboard.writeText(url); alert("تم نسخ الرابط"); }
    },

    switchTab(tab, btn) {
        this.activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.showGrid();
    },

    closeFeed() { 
        Utils.setParam(null); 
        this.render(); 
    }
};
app.init();

</script>
    
</body>
</html>
