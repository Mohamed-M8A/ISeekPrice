<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="iWatch">
    <meta property="og:title" content="iWatch - شاهد أفضل الفيديوهات للمنتجات الرائجة">
    <meta property="og:description" content="تصفح واكتشف أفضل المنتجات والخصومات الحصرية عبر مقاطع فيديو سريعة.">
    <meta property="og:image" content="https://www.iseekprice.com/public/assets/static/iwatch.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="iWatch - شاهد أفضل الفيديوهات للمنتجات الرائجة">
    <meta name="twitter:image" content="https://www.iseekprice.com/public/assets/static/iwatch.png">
    
    <title>iWatch - شاهد افضل الفيديوهات للمنتجات الرائجة</title>
    <link rel="icon" type="image/png" href="/public/assets/static/iwatch.webp">
    <link rel="stylesheet" href="/public/css/iwatch.css">
</head>
<body>

    <div id="gridUI">
        <header class="site-header">
            <div class="logo-group" onclick="location.href='?'">
                <img src="/public/assets/static/iwatch.png" alt="logo" class="header-logo-img">
                <span class="logo-txt">iWatch</span>
            </div>
            <a href="https://www.iseekprice.com" class="back-link">العودة للرئيسية</a>
        </header>
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="app.switchTab('all', this)">الكل</button>
            <button class="tab-btn" onclick="app.switchTab('likes', this)">المفضلة</button>
        </nav>
        <main class="v-grid" id="mainGrid"></main>
    </div>

    <div id="feedUI" class="hidden-view">
        <div class="feed-container" id="verticalFeed"></div>
    </div>

<script>
    
const CONFIG = {
    DATA: "https://data.iseekprice.com/General/videos.json",
    VIDEO: "https://video.iseekprice.com/",
    MEDIA: "https://media.iseekprice.com/",
    DOMAIN: "https://www.iseekprice.com/",
    ICONS: "/public/assets/static/icons.svg"
};

const Storage = {
    getLikes: () => JSON.parse(localStorage.getItem('fav_vids') || '[]'),
    toggleLike: (uid) => {
        let likes = Storage.getLikes();
        const idx = likes.indexOf(String(uid));
        if (idx > -1) likes.splice(idx, 1); else likes.push(String(uid));
        localStorage.setItem('fav_vids', JSON.stringify(likes));
        return idx === -1;
    }
};

const Utils = {
    toHex: (u) => BigInt(u).toString(16),
    fromHex: (h) => {
        try { return BigInt("0x" + h).toString(); }
        catch(e) { return null; }
    },
    getParam: (p) => new URLSearchParams(window.location.search).get(p),
    setParam: (v) => {
        const url = v ? `?v=${v}` : window.location.pathname;
        window.history.replaceState({}, '', url);  
    }
};

let audioState = { isMuted: false, volume: 0.5 };

function syncGlobalAudio() {
    document.querySelectorAll('video').forEach(v => {
        v.muted = audioState.isMuted;
        v.volume = audioState.volume;
    });
    document.querySelectorAll('.v-mute-btn svg use').forEach(u => {
        u.setAttribute('href', `${CONFIG.ICONS}${audioState.isMuted ? '#i-volume-off' : '#i-volume-on'}`);
    });
}

const app = {
    allData: [],
    activeTab: 'all',
    originalTitle: document.title,
    observer: null,

    async init() {
        try {
            const res = await fetch(`${CONFIG.DATA}?v=${Date.now()}`);
            this.allData = await res.json();
            this.render();
            window.addEventListener('popstate', () => this.render());
        } catch (e) { console.error(e); }
    },

    render() {
        const vHex = Utils.getParam('v');
        if (vHex) {
            const uid = Utils.fromHex(vHex);
            const exists = uid ? this.allData.find(i => String(i.uid) === String(uid)) : null;
            if (exists) {
                this.showFeed(uid);
            } else {
                Utils.setParam(null);
                document.title = this.originalTitle;
                this.showGrid();
            }
        } else {
            document.title = this.originalTitle;
            this.showGrid();
        }
    },

    showGrid() {
        document.getElementById('gridUI').style.display = 'block';
        document.getElementById('feedUI').style.display = 'none';
        const container = document.getElementById('mainGrid');
        container.innerHTML = '';
        
        let list = this.activeTab === 'likes' ? this.allData.filter(i => Storage.getLikes().includes(String(i.uid))) : this.allData;
        
        list.forEach(item => {
            const card = document.createElement('a');
            const hexParam = Utils.toHex(item.uid);
            card.className = 'grid-card';
            card.href = `?v=${hexParam}`;
            card.innerHTML = `<div class="g-badge">${item.orders} طلب</div><img src="${CONFIG.MEDIA}${item.tPath}.webp" loading="lazy"><div class="g-title">${item.title}</div>`;
            card.onclick = (e) => { 
                e.preventDefault(); 
                Utils.setParam(hexParam); 
                this.render(); 
            };
            container.appendChild(card);
        });
    },

    showFeed(targetUid) {
        document.getElementById('gridUI').style.display = 'none';
        document.getElementById('feedUI').style.display = 'block';
        const container = document.getElementById('verticalFeed');
        container.innerHTML = '';
        
        let list = [...this.allData];
        const idx = list.findIndex(i => String(i.uid) === String(targetUid));
        if (idx > -1) {
            const targetItem = list.splice(idx, 1)[0];
            list.unshift(targetItem);
        }
        
        list.forEach(item => container.appendChild(this.createFullCard(item)));
        
        if (this.observer) this.observer.disconnect();

        this.observer = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                const v = e.target.querySelector('video');
                if (e.isIntersecting) {
                    v.preload = "auto";
                    v.play().catch(()=>{}); 
                    syncGlobalAudio(); 
                    
                    const currentUid = e.target.getAttribute('data-uid');
                    const currentTitle = e.target.getAttribute('data-title');
                    document.title = `${currentTitle} - iWatch`;
                    Utils.setParam(Utils.toHex(currentUid));

                    let next1 = e.target.nextElementSibling;
                    if (next1) {
                        let v1 = next1.querySelector('video');
                        v1.preload = "auto";
                        let next2 = next1.nextElementSibling;
                        if (next2) next2.querySelector('video').preload = "auto";
                    }
                } else {
                    v.pause();
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.video-card').forEach(c => this.observer.observe(c));
        
        if(list[0]) document.title = `${list[0].title} - iWatch`;
    },

    createFullCard(item) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.setAttribute('data-uid', item.uid);
        card.setAttribute('data-title', item.title);
        
        const isLiked = Storage.getLikes().includes(String(item.uid));
        card.innerHTML = `
            <div class="v-top-bar">
                <div class="v-mute-btn" onclick="app.toggleMute(event)"><svg><use href="${CONFIG.ICONS}${audioState.isMuted ? '#i-volume-off' : '#i-volume-on'}"/></svg></div>
                <div class="v-close-btn" onclick="app.closeFeed()"><svg><use href="${CONFIG.ICONS}#i-close"/></svg></div>
            </div>
            <div class="v-state-overlay"><svg><use href="${CONFIG.ICONS}#i-play"/></svg></div>
            <div class="v-bg-skeleton" style="background-image:url(${CONFIG.MEDIA}${item.tPath}.webp)"></div>
            <video src="${CONFIG.VIDEO}${item.vFile}.mp4" poster="${CONFIG.MEDIA}${item.tPath}.webp" loop playsinline muted preload="metadata"></video>
            <div class="v-overlay">
                <div class="v-details">
                    <div class="v-order-info">${item.orders} طلب مؤكد</div>
                    <h2 class="v-title">${item.title}</h2>
                    <div class="v-actions">
                        <a href="${CONFIG.DOMAIN}${item.path}" target="_blank" class="btn-order" onclick="event.stopPropagation()">معاينة العرض</a>
                        <button class="btn-fav ${isLiked ? 'active' : ''}" onclick="app.handleLike(event, this, '${item.uid}')"><svg><use href="${CONFIG.ICONS}#i-heart"/></svg></button>
                        <button class="btn-share" onclick="app.handleShare(event, '${item.uid}', '${item.title}')"><svg><use href="${CONFIG.ICONS}#i-share-node"/></svg></button>
                    </div>
                </div>
                <div class="v-progress-container" onclick="app.handleSeek(event, this)">
                    <div class="v-progress-bar"></div>
                </div>
            </div>
        `;
        
        const v = card.querySelector('video'), overlay = card.querySelector('.v-state-overlay'), p = card.querySelector('.v-progress-bar');
        card.onclick = () => {
            const use = overlay.querySelector('svg use');
            if(v.paused) { v.play(); use.setAttribute('href', `${CONFIG.ICONS}#i-play`); } 
            else { v.pause(); use.setAttribute('href', `${CONFIG.ICONS}#i-pause`); }
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 500);
        };
        v.ontimeupdate = () => { 
            const percent = (v.currentTime / v.duration) * 100;
            p.style.width = `${percent}%`; 
        };
        return card;
    },

    handleSeek(e, container) {
        e.stopPropagation();
        const v = container.closest('.video-card').querySelector('video');
        const rect = container.getBoundingClientRect();
        const pos = (rect.right - e.clientX) / rect.width;
        v.currentTime = pos * v.duration;
    },

    toggleMute(e) { 
        e.stopPropagation(); 
        audioState.isMuted = !audioState.isMuted; 
        syncGlobalAudio(); 
    },

    handleLike(e, btn, uid) { 
        e.stopPropagation(); 
        btn.classList.toggle('active', Storage.toggleLike(uid)); 
    },

    handleShare(e, uid, title) {
        e.stopPropagation();
        const url = `${window.location.origin}${window.location.pathname}?v=${Utils.toHex(uid)}`;
        if (navigator.share) navigator.share({ title, url });
        else { navigator.clipboard.writeText(url); alert("تم نسخ الرابط"); }
    },

    switchTab(tab, btn) {
        this.activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.showGrid();
    },

    closeFeed() { 
        Utils.setParam(null); 
        this.render(); 
    }
};

app.init();

</script>
    
</body>
</html>
