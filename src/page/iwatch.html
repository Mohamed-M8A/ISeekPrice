<script>
// ==========================================
// 1. GLOBAL CONFIGURATION
// ==========================================
const CONFIG = {
    DATA: "https://data.iseekprice.com/general/videos.json",
    VIDEO: "https://video.iseekprice.com/",
    MEDIA: "https://media.iseekprice.com/",
    DOMAIN: "https://www.iseekprice.com/",
    ICONS: "/public/assets/static/icons.svg"
};

// ==========================================
// 2. LOCAL STORAGE — FAVORITES
// ==========================================
const Storage = {
    getLikes() {
        return JSON.parse(localStorage.getItem('fav_vids') || '[]');
    },
    toggleLike(uid) {
        const likes = this.getLikes();
        const idx = likes.indexOf(String(uid));
        if (idx > -1) likes.splice(idx, 1); else likes.push(String(uid));
        localStorage.setItem('fav_vids', JSON.stringify(likes));
        return idx === -1;
    }
};

// ==========================================
// 3. URL / ID UTILITIES — replaceParam is used for silent,
// high-frequency updates (feed scrolling); pushParam is used
// for deliberate navigation (favorites page, list selections)
// so the browser back button behaves as expected in each case
// ==========================================
const Utils = {
    toHex(u) { return BigInt(u).toString(16); },
    fromHex(h) {
        try { return BigInt("0x" + h).toString(); }
        catch (e) { return null; }
    },
    getParam(p) { return new URLSearchParams(window.location.search).get(p); },
    replaceParam(params) {
        const url = new URL(window.location.href);
        Object.entries(params).forEach(([k, v]) => v === null ? url.searchParams.delete(k) : url.searchParams.set(k, v));
        window.history.replaceState({}, '', url.pathname + url.search);
    },
    pushParam(params) {
        const url = new URL(window.location.href);
        url.search = '';
        Object.entries(params).forEach(([k, v]) => { if (v !== null && v !== undefined) url.searchParams.set(k, v); });
        window.history.pushState({}, '', url.pathname + url.search);
    }
};

// ==========================================
// 4. AUDIO & PLAYBACK SETTINGS — volume, mute and speed,
// persisted in localStorage and applied to every mounted
// video element; remembers the last volume before a mute
// ==========================================
const AudioSettings = {
    state: { volume: 0.5, muted: false, lastVolume: 0.5, speed: 1 },

    load() {
        const saved = JSON.parse(localStorage.getItem('player_settings') || '{}');
        this.state.volume = saved.volume ?? 0.5;
        this.state.muted = saved.muted ?? false;
        this.state.lastVolume = saved.lastVolume ?? this.state.volume;
        this.state.speed = saved.speed ?? 1;
    },
    persist() {
        localStorage.setItem('player_settings', JSON.stringify(this.state));
    },
    setVolume(val) {
        this.state.volume = val;
        if (val > 0) { this.state.muted = false; this.state.lastVolume = val; }
        this.persist();
        this.applyToAll();
    },
    toggleMute() {
        if (this.state.muted) {
            this.state.muted = false;
            this.state.volume = this.state.lastVolume || 0.5;
        } else {
            this.state.muted = true;
            if (this.state.volume > 0) this.state.lastVolume = this.state.volume;
        }
        this.persist();
        this.applyToAll();
    },
    setSpeed(val) {
        this.state.speed = val;
        this.persist();
        this.applyToAll();
    },
    applyTo(video) {
        video.muted = this.state.muted;
        video.volume = this.state.volume;
        video.playbackRate = this.state.speed;
    },
    applyToAll() {
        document.querySelectorAll('video').forEach(v => this.applyTo(v));
        document.querySelectorAll('.v-mute-btn use').forEach(use => {
            use.setAttribute('href', `${CONFIG.ICONS}${this.state.muted ? '#i-volume-off' : '#i-volume-on'}`);
        });
    }
};

// ==========================================
// 5. VIDEO LOADER — two independent observers on purpose:
// playObserver decides which single card is actually visible
// and should play, using the real viewport with no margin;
// preloadObserver uses a wide margin only to warm up or
// release sources nearby. Mixing both concerns into one
// observer previously caused several videos to report as
// "visible enough" at once and play simultaneously.
// activate() also force-pauses every other mounted video as
// a safety net against any remaining timing race.
// ==========================================
const VideoLoader = {
    playObserver: null,
    preloadObserver: null,
    activeVideo: null,
    onActivate: null,

    attach(container, onActivate) {
        this.onActivate = onActivate || (() => {});
        if (this.playObserver) this.playObserver.disconnect();
        if (this.preloadObserver) this.preloadObserver.disconnect();

        this.playObserver = new IntersectionObserver(this.handlePlayEntries.bind(this), {
            root: container,
            threshold: 0.6
        });
        this.preloadObserver = new IntersectionObserver(this.handlePreloadEntries.bind(this), {
            root: container,
            rootMargin: '150% 0px 150% 0px',
            threshold: 0
        });
    },

    observeCard(card) {
        this.playObserver.observe(card);
        this.preloadObserver.observe(card);
    },
    unobserveCard(card) {
        this.playObserver.unobserve(card);
        this.preloadObserver.unobserve(card);
    },

    handlePlayEntries(entries) {
        entries.forEach(entry => {
            const video = entry.target.querySelector('video');
            if (!video) return;
            if (entry.isIntersecting) this.activate(entry.target, video);
            else video.pause();
        });
    },

    handlePreloadEntries(entries) {
        entries.forEach(entry => {
            const video = entry.target.querySelector('video');
            if (!video) return;
            if (entry.isIntersecting) this.warm(video);
            else this.release(video);
        });
    },

    warm(video) {
        if (!video.src && video.dataset.src) {
            video.src = video.dataset.src;
            video.preload = 'auto';
            video.load();
        }
    },

    activate(card, video) {
        document.querySelectorAll('#verticalFeed video').forEach(v => { if (v !== video) v.pause(); });
        this.warm(video);
        video.play().catch(() => {});
        AudioSettings.applyTo(video);
        this.activeVideo = video;

        document.title = `${card.getAttribute('data-title')} - iWatch`;
        Utils.replaceParam({ v: Utils.toHex(card.getAttribute('data-uid')) });
        this.onActivate(card, video);
    },

    release(video) {
        if (video.src) {
            video.pause();
            video.removeAttribute('src');
            video.load();
            video.preload = 'none';
            const bar = video.closest('.video-card')?.querySelector('.v-progress-bar');
            if (bar) bar.style.width = '0%';
        }
    },

    retry(card) {
        const video = card.querySelector('video');
        if (!video) return;
        card.querySelector('.v-error-overlay')?.classList.remove('active');
        video.src = video.dataset.src;
        video.load();
        AudioSettings.applyTo(video);
        video.play().catch(() => this.showError(card));
    },

    showError(card) {
        card.querySelector('.v-error-overlay')?.classList.add('active');
    }
};

// ==========================================
// 6. SHARED UI HELPERS
// ==========================================
function setView(view) {
    document.getElementById('gridUI').style.display = view === 'grid' ? 'block' : 'none';
    document.getElementById('feedUI').style.display = view === 'feed' ? 'block' : 'none';
    document.getElementById('favUI').style.display = view === 'fav' ? 'block' : 'none';
    document.getElementById('favToggleBtn').style.display = view === 'feed' ? 'flex' : 'none';
    FavoritesSidebar.close();
    SettingsPanel.close();
}

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'app-toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

function seekVideo(video, delta) {
    if (!video.duration) return;
    video.currentTime = Math.min(Math.max(video.currentTime + delta, 0), video.duration);
}

function togglePlayback(video, overlay) {
    const use = overlay.querySelector('use');
    if (video.paused) {
        video.play();
        use.setAttribute('href', `${CONFIG.ICONS}#i-play`);
    } else {
        video.pause();
        use.setAttribute('href', `${CONFIG.ICONS}#i-pause`);
    }
    overlay.classList.add('active');
    setTimeout(() => overlay.classList.remove('active'), 500);
}

function flashSeek(card, forward) {
    const flash = document.createElement('div');
    flash.className = `seek-flash ${forward ? 'right' : 'left'}`;
    const arrow = forward
        ? '<path d="M13 5l7 7-7 7M4 5l7 7-7 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M11 5l-7 7 7 7M20 5l-7 7 7 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    flash.innerHTML = `<svg viewBox="0 0 24 24">${arrow}</svg><span>10 ثانية</span>`;
    card.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
}

function toggleLikeFromCard(card, btn) {
    const liked = Storage.toggleLike(card.dataset.uid);
    btn.classList.toggle('active', liked);
    if (document.getElementById('favSidebar').classList.contains('active')) FavoritesSidebar.render();
}

function shareCard(card) {
    const uid = card.dataset.uid;
    const title = card.dataset.title;
    const url = `${window.location.origin}${window.location.pathname}?v=${Utils.toHex(uid)}`;
    if (navigator.share) {
        navigator.share({ title, url });
    } else {
        navigator.clipboard.writeText(url);
        showToast('تم نسخ الرابط');
    }
}

// ==========================================
// 7. SETTINGS PANEL
// ==========================================
const SettingsPanel = {
    el: null,

    init() {
        this.el = document.getElementById('settingsOverlay');
        document.getElementById('settingsCloseBtn').addEventListener('click', () => this.close());
        this.el.addEventListener('click', (e) => { if (e.target === this.el) this.close(); });
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => this.setSpeed(parseFloat(btn.dataset.speed), btn));
        });
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            AudioSettings.setVolume(parseFloat(e.target.value));
        });
    },
    open() {
        document.querySelectorAll('.speed-btn').forEach(b => {
            b.classList.toggle('active', parseFloat(b.dataset.speed) === AudioSettings.state.speed);
        });
        document.getElementById('volumeSlider').value = AudioSettings.state.volume;
        this.el.classList.add('active');
    },
    close() {
        this.el.classList.remove('active');
    },
    setSpeed(val, btn) {
        AudioSettings.setSpeed(val);
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
};

// ==========================================
// 8. FAVORITES SIDEBAR — quick access while inside the feed
// ==========================================
const FavoritesSidebar = {
    el: null, overlay: null, list: null,

    init() {
        this.el = document.getElementById('favSidebar');
        this.overlay = document.getElementById('favSidebarOverlay');
        this.list = document.getElementById('favSidebarList');
        document.getElementById('favToggleBtn').addEventListener('click', () => this.toggle());
        document.getElementById('favSidebarCloseBtn').addEventListener('click', () => this.close());
        this.overlay.addEventListener('click', () => this.close());
    },
    toggle() {
        const opening = !this.el.classList.contains('active');
        this.el.classList.toggle('active', opening);
        this.overlay.classList.toggle('active', opening);
        if (opening) this.render();
    },
    close() {
        this.el.classList.remove('active');
        this.overlay.classList.remove('active');
    },
    render() {
        const items = app.allData.filter(i => Storage.getLikes().includes(String(i.uid)));
        if (!items.length) {
            this.list.innerHTML = `<div class="fav-empty">لا توجد فيديوهات مفضلة بعد</div>`;
            return;
        }
        this.list.innerHTML = items.map(item => `
            <div class="fav-item" data-uid="${item.uid}">
                <img src="${CONFIG.MEDIA}${item.tPath}.webp" loading="lazy">
                <div class="fav-item-title">${item.title}</div>
            </div>
        `).join('');
        this.list.querySelectorAll('.fav-item').forEach(row => {
            row.addEventListener('click', () => {
                this.close();
                Utils.pushParam({ v: Utils.toHex(row.dataset.uid) });
                app.render();
            });
        });
    }
};

// ==========================================
// 9. FAVORITES PAGE — standalone list-style screen, distinct
// from the grid, with a header, play-all action and empty state
// ==========================================
const FavoritesPage = {
    listEl: null,

    init() {
        this.listEl = document.getElementById('favList');
        document.getElementById('favBackBtn').addEventListener('click', () => app.exitFavorites());
        document.getElementById('favEmptyBrowseBtn').addEventListener('click', () => app.exitFavorites());
        document.getElementById('favPlayAllBtn').addEventListener('click', () => this.playAll());
        this.listEl.addEventListener('click', (e) => {
            const row = e.target.closest('.fav-row');
            if (!row) return;
            if (e.target.closest('[data-action="remove"]')) {
                Storage.toggleLike(row.dataset.uid);
                this.render();
                return;
            }
            Utils.pushParam({ v: Utils.toHex(row.dataset.uid) });
            app.render();
        });
    },
    render() {
        const items = app.allData.filter(i => Storage.getLikes().includes(String(i.uid)));
        document.getElementById('favPageCount').textContent = `${items.length} فيديو`;
        document.getElementById('favPlayAllBtn').style.display = items.length ? 'flex' : 'none';
        document.getElementById('favEmptyState').style.display = items.length ? 'none' : 'flex';
        this.listEl.style.display = items.length ? 'block' : 'none';
        this.listEl.innerHTML = items.map(item => `
            <div class="fav-row" data-uid="${item.uid}">
                <img class="fav-row-thumb" src="${CONFIG.MEDIA}${item.tPath}.webp" loading="lazy">
                <div class="fav-row-info">
                    <h3 class="fav-row-title">${item.title}</h3>
                    <span class="fav-row-meta">${item.orders} طلب</span>
                </div>
                <button class="fav-row-play" title="تشغيل"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></button>
                <button class="fav-row-remove" data-action="remove" title="إزالة من المفضلة"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
        `).join('');
    },
    playAll() {
        const items = app.allData.filter(i => Storage.getLikes().includes(String(i.uid)));
        if (!items.length) return;
        Utils.pushParam({ v: Utils.toHex(items[0].uid) });
        app.render();
    }
};

// ==========================================
// 10. FEED WINDOW — keeps the number of mounted cards bounded
// regardless of how many videos exist in total. BATCH_SIZE is
// appended whenever the active card gets within BUFFER_AHEAD
// of the end of what is rendered; anything more than
// TRIM_BEHIND cards above the active one is unmounted and its
// scroll offset compensated so the visible position is unaffected
// ==========================================
const FeedWindow = { BATCH_SIZE: 6, BUFFER_AHEAD: 3, TRIM_BEHIND: 4 };

// ==========================================
// 11. CORE APPLICATION — routing between grid, feed and
// favorites page, plus the video card builder
// ==========================================
const app = {
    allData: [],
    feedList: [],
    renderedIndex: 0,
    originalTitle: document.title,

    async init() {
        try {
            const res = await fetch(`${CONFIG.DATA}?v=${Date.now()}`);
            const data = await res.json();
            this.allData = Array.isArray(data)
                ? data.filter(item => item && item.uid !== undefined && item.vFile && item.tPath)
                : [];
            this.render();
        } catch (e) {
            console.error(e);
        }
    },

    render() {
        const vHex = Utils.getParam('v');
        if (vHex) {
            const uid = Utils.fromHex(vHex);
            const exists = uid && this.allData.find(i => String(i.uid) === String(uid));
            if (exists) return this.showFeed(uid);
            Utils.replaceParam({ v: null });
        }
        if (Utils.getParam('view') === 'fav') return this.showFavoritesPage();
        document.title = this.originalTitle;
        this.showGrid();
    },

    showGrid() {
        setView('grid');
        const container = document.getElementById('mainGrid');
        container.innerHTML = '';
        this.allData.forEach(item => {
            const card = document.createElement('a');
            const hex = Utils.toHex(item.uid);
            card.className = 'grid-card';
            card.href = `?v=${hex}`;
            card.innerHTML = `<div class="g-badge">${item.orders} طلب</div><img src="${CONFIG.MEDIA}${item.tPath}.webp" loading="lazy"><div class="g-title">${item.title}</div>`;
            card.addEventListener('click', (e) => {
                e.preventDefault();
                Utils.replaceParam({ v: hex });
                this.render();
            });
            container.appendChild(card);
        });
    },

    showFeed(targetUid) {
        setView('feed');
        const container = document.getElementById('verticalFeed');

        container.querySelectorAll('video').forEach(video => VideoLoader.release(video));
        container.innerHTML = '';

        const list = [...this.allData];
        const idx = list.findIndex(i => String(i.uid) === String(targetUid));
        if (idx > -1) list.unshift(list.splice(idx, 1)[0]);
        this.feedList = list;
        this.renderedIndex = 0;

        VideoLoader.attach(container, (card) => this.onCardActive(card));
        this.appendCards(FeedWindow.BATCH_SIZE);

        if (list[0]) document.title = `${list[0].title} - iWatch`;
    },

    appendCards(count) {
        const container = document.getElementById('verticalFeed');
        const end = Math.min(this.renderedIndex + count, this.feedList.length);
        for (let i = this.renderedIndex; i < end; i++) {
            const card = this.createFullCard(this.feedList[i]);
            card.dataset.index = i;
            container.appendChild(card);
            VideoLoader.observeCard(card);
        }
        this.renderedIndex = end;
    },

    onCardActive(card) {
        const index = parseInt(card.dataset.index, 10);
        if (index + FeedWindow.BUFFER_AHEAD >= this.renderedIndex && this.renderedIndex < this.feedList.length) {
            this.appendCards(FeedWindow.BATCH_SIZE);
        }
        this.trimBehind(index);
    },

    trimBehind(currentIndex) {
        const container = document.getElementById('verticalFeed');
        let removedHeight = 0;
        let card = container.firstElementChild;
        while (card) {
            const next = card.nextElementSibling;
            const cardIndex = parseInt(card.dataset.index, 10);
            if (cardIndex < currentIndex - FeedWindow.TRIM_BEHIND) {
                removedHeight += card.offsetHeight;
                VideoLoader.unobserveCard(card);
                VideoLoader.release(card.querySelector('video'));
                card.remove();
                card = next;
            } else {
                break;
            }
        }
        if (removedHeight > 0) container.scrollTop -= removedHeight;
    },

    showFavoritesPage() {
        setView('fav');
        FavoritesPage.render();
    },

    goFavorites() {
        Utils.pushParam({ view: 'fav' });
        this.render();
    },
    exitFavorites() {
        Utils.pushParam({});
        this.render();
    },
    closeFeed() {
        Utils.replaceParam({ v: null });
        this.render();
    },

    createFullCard(item) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.uid = item.uid;
        card.dataset.title = item.title;

        const isLiked = Storage.getLikes().includes(String(item.uid));
        const videoUrl = `${CONFIG.VIDEO}${item.vFile}.mp4`;

        card.innerHTML = `
            <div class="v-top-bar">
                <div class="v-top-bar-left">
                    <button class="v-settings-btn" data-action="settings" title="الإعدادات">
                        <svg viewBox="0 0 24 24"><path d="M19.14,12.94a7.14,7.14,0,0,0,.06-1,7.14,7.14,0,0,0-.06-1l2.11-1.65a.5.5,0,0,0,.12-.64l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.3,7.3,0,0,0-1.72-1L14.14,2.5a.5.5,0,0,0-.5-.42h-4a.5.5,0,0,0-.5.42l-.38,2.65a7.3,7.3,0,0,0-1.72,1l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.64L4.2,10.94a7.14,7.14,0,0,0-.06,1,7.14,7.14,0,0,0,.06,1L2.09,14.6a.5.5,0,0,0-.12.64l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.3,7.3,0,0,0,1.72,1l.38,2.65a.5.5,0,0,0,.5.42h4a.5.5,0,0,0,.5-.42l.38-2.65a7.3,7.3,0,0,0,1.72-1l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.64ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" fill="#fff"/></svg>
                    </button>
                </div>
                <div class="v-top-bar-right">
                    <button class="v-mute-btn" data-action="mute"><svg><use href="${CONFIG.ICONS}${AudioSettings.state.muted ? '#i-volume-off' : '#i-volume-on'}"/></svg></button>
                    <button class="v-close-btn" data-action="close"><svg><use href="${CONFIG.ICONS}#i-close"/></svg></button>
                </div>
            </div>
            <div class="v-state-overlay"><svg><use href="${CONFIG.ICONS}#i-play"/></svg></div>
            <div class="v-loading"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"/></svg></div>
            <div class="v-bg-skeleton" style="background-image:url(${CONFIG.MEDIA}${item.tPath}.webp)"></div>
            <video poster="${CONFIG.MEDIA}${item.tPath}.webp" data-src="${videoUrl}" loop playsinline muted preload="none"></video>
            <div class="v-error-overlay">
                <p>تعذر تحميل الفيديو</p>
                <button data-action="retry">إعادة المحاولة</button>
            </div>
            <div class="v-overlay">
                <div class="v-details">
                    <div class="v-order-info">${item.orders} طلب مؤكد</div>
                    <h2 class="v-title">${item.title}</h2>
                    <div class="v-actions">
                        <a href="${CONFIG.DOMAIN}${item.path}" target="_blank" class="btn-order" data-action="order">معاينة العرض</a>
                        <button class="btn-fav ${isLiked ? 'active' : ''}" data-action="like"><svg><use href="${CONFIG.ICONS}#i-heart"/></svg></button>
                        <button class="btn-share" data-action="share"><svg><use href="${CONFIG.ICONS}#i-share-node"/></svg></button>
                    </div>
                </div>
                <div class="v-progress-container">
                    <div class="v-progress-bar"></div>
                </div>
            </div>
        `;

        const video = card.querySelector('video');
        const overlay = card.querySelector('.v-state-overlay');
        const loading = card.querySelector('.v-loading');
        const progressBar = card.querySelector('.v-progress-bar');
        const progressContainer = card.querySelector('.v-progress-container');

        video.addEventListener('error', () => VideoLoader.showError(card));
        video.addEventListener('loadedmetadata', () => {
            if (video.videoWidth > video.videoHeight) card.classList.add('is-landscape');
        });
        video.addEventListener('waiting', () => loading.classList.add('active'));
        video.addEventListener('playing', () => loading.classList.remove('active'));
        video.addEventListener('canplay', () => loading.classList.remove('active'));
        video.addEventListener('timeupdate', () => {
            if (video.duration) progressBar.style.width = `${(video.currentTime / video.duration) * 100}%`;
        });

        progressContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = progressContainer.getBoundingClientRect();
            const ratio = (rect.right - e.clientX) / rect.width;
            if (video.duration) video.currentTime = ratio * video.duration;
        });

        let tapTimer = null;
        card.addEventListener('click', (e) => {
            if (e.target.closest('[data-action], .v-progress-container')) return;
            if (tapTimer) {
                clearTimeout(tapTimer);
                tapTimer = null;
                const rect = card.getBoundingClientRect();
                const isRight = (e.clientX - rect.left) > rect.width / 2;
                seekVideo(video, isRight ? 10 : -10);
                flashSeek(card, isRight);
                return;
            }
            tapTimer = setTimeout(() => {
                togglePlayback(video, overlay);
                tapTimer = null;
            }, 250);
        });

        return card;
    }
};

// ==========================================
// 12. FEED EVENT DELEGATION — one listener handles every
// button inside every card instead of wiring each individually
// ==========================================
document.getElementById('verticalFeed').addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    if (action === 'order') return;

    e.stopPropagation();
    e.preventDefault();
    const card = actionEl.closest('.video-card');

    switch (action) {
        case 'mute': AudioSettings.toggleMute(); break;
        case 'close': app.closeFeed(); break;
        case 'settings': SettingsPanel.open(); break;
        case 'like': toggleLikeFromCard(card, actionEl); break;
        case 'share': shareCard(card); break;
        case 'retry': VideoLoader.retry(card); break;
    }
});

// ==========================================
// 13. KEYBOARD SHORTCUTS — mirrors the on-screen double-tap
// seek gesture for desktop use
// ==========================================
document.addEventListener('keydown', (e) => {
    if (document.getElementById('feedUI').style.display !== 'block') return;
    if (!VideoLoader.activeVideo) return;
    if (e.key === 'ArrowRight') seekVideo(VideoLoader.activeVideo, 10);
    else if (e.key === 'ArrowLeft') seekVideo(VideoLoader.activeVideo, -10);
});

// ==========================================
// 14. BOOT
// ==========================================
document.addEventListener('selectstart', (e) => e.preventDefault());
AudioSettings.load();
SettingsPanel.init();
FavoritesSidebar.init();
FavoritesPage.init();
document.getElementById('favNavBtn').addEventListener('click', () => app.goFavorites());
window.addEventListener('popstate', () => app.render());
app.init();

</script>
