<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISearch - ابحث عن المنتجات بسرعة الضوء</title>
<link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
<link href='/public/css/style.min.css' rel='stylesheet'/> 
<style>
    
.search-layout-wrapper{display:flex;gap:20px;align-items:flex-start;margin:20px 0 40px;overflow:visible!important}.search-sidebar{width:280px;flex-shrink:0;background:#fff;border:1px solid #000;position:sticky;top:20px;padding:20px;box-sizing:border-box;max-height:calc(100vh - 40px);overflow-y:auto;z-index:9999}.search-sidebar::-webkit-scrollbar{width:6px}.search-sidebar::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}.sidebar-header{font-size:18px;font-weight:900;margin-bottom:20px;border-bottom:2px solid #febd69;padding-bottom:10px}.filter-section{margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #eee}.filter-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}.filter-title{font-size:15px;font-weight:800;margin-bottom:10px;display:block}.custom-select,.price-inputs input{width:100%;padding:8px 12px;border:1px solid #ccc;background:#f9f9f9;font-weight:700;outline:none;box-sizing:border-box}.price-inputs{display:flex;gap:8px;margin-bottom:10px}.apply-btn{width:100%;background:#111;color:#fff;border:1px solid #000;padding:8px;font-weight:900;cursor:pointer;transition:.3s}.apply-btn:hover{background:#fff;color:#000}.checkbox-group{display:flex;flex-direction:column;gap:10px}.checkbox-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}.checkbox-label input{width:16px;height:16px;accent-color:#febd69}.search-results-area{flex:1;min-width:0;display:flex;flex-direction:column}.results-header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 20px;border:1px solid #000;margin-bottom:15px;z-index:99;position:relative}.view-toggle{display:flex;gap:8px}.view-toggle button{background:#f1f1f1;border:1px solid #ccc;padding:6px 12px;cursor:pointer;color:#555;transition:.2s}.view-toggle button.active{background:#111;color:#fff;border-color:#000}.product-grid.list-view{display:flex;flex-direction:column;gap:10px;padding:0;background:0 0;border:none}.product-grid.list-view .product-card{flex-direction:row;height:220px;margin:0}.product-grid.list-view .image-container{width:220px;min-width:220px;padding-top:0;height:100%;border-bottom:none;border-left:1px solid #000}.product-grid.list-view .post-content{justify-content:center}.product-grid.list-view .post-title{height:auto;font-size:18px;margin-bottom:15px}.mobile-filter-btn{display:none;position:fixed;bottom:80px;left:25px;z-index:99999;background:#111;color:#fff;border:1px solid #000;padding:12px 20px;box-shadow:0 4px 15px rgba(0,0,0,.3);font-weight:900;align-items:center;gap:8px}@media (max-width:992px){.search-layout-wrapper{flex-direction:column;margin-top:10px}.search-sidebar{position:fixed;right:-320px;top:0;height:100vh;max-height:100vh;width:300px;z-index:100001;transition:right .4s;box-shadow:-5px 0 20px rgba(0,0,0,.2)}.search-sidebar.active{right:0}.mobile-filter-btn{display:flex}.product-grid.list-view .product-card{height:160px}.product-grid.list-view .image-container{width:140px;min-width:140px}.product-grid.list-view .post-title{font-size:14px}}body.dm .search-sidebar,body.dm .results-header,body.dark .search-sidebar,body.dark .results-header,[data-theme=dark] .search-sidebar,[data-theme=dark] .results-header{background:#1a1a1a!important;color:#fff!important;border-color:#333!important}body.dm #query-heading,body.dark #query-heading,[data-theme=dark] #query-heading{color:#fff!important}body.dm .filter-section,body.dark .filter-section,[data-theme=dark] .filter-section{border-color:#333!important}body.dm .custom-select,body.dm .price-inputs input,body.dark .custom-select,body.dark .price-inputs input,[data-theme=dark] .custom-select,[data-theme=dark] .price-inputs input{background:#2d2d2d!important;color:#fff!important;border-color:#444!important}body.dm .apply-btn,body.dm .view-toggle button.active,body.dark .apply-btn,body.dark .view-toggle button.active,[data-theme=dark] .apply-btn,[data-theme=dark] .view-toggle button.active{background:#fff!important;color:#111!important;border-color:#fff!important}body.dm .view-toggle button,body.dark .view-toggle button,[data-theme=dark] .view-toggle button{background:#2a2a2a!important;border-color:#444!important;color:#aaa!important}

</style>
</head>
<body>

<header id='header' itemscope='itemscope' itemtype='https://schema.org/WPHeader'>
  <div class='header-main-row'>
    <div class='header-container'>
      <div class='logo' id='logo-wrap'></div>
      <div class='search-container' id='search-wrap'></div>
      <div class='header-actions' id='actions-wrap'></div>
    </div>
  </div>
  <nav id='widget-topbar'></nav>
</header>

<div id='widget-sidebar'></div>
<div id='widget-overlay'></div>
    
<button id="mobile-filter-trigger" class="mobile-filter-btn">
    <svg style="width:20px;height:20px" viewBox="0 0 24 24"><path fill="currentColor" d="M3,2H21V2H21V4H18L15,10V22H9V10L6,4H3V2M11,11V19H13V11L16,5H8L11,11Z" /></svg>
    تصفية النتائج
</button>

<div id='primary' style="overflow: visible !important;">
    <div class="search-layout-wrapper">
        <aside id="search-sidebar" class="search-sidebar">
            <div class="sidebar-header">تصفية البحث</div>
            
            <div class="filter-section">
                <div class="filter-title">الترتيب حسب</div>
                <select id="sort-select" class="custom-select">
                    <option value="relevance">الأكثر تطابقاً</option>
                    <option value="orders_desc">الأكثر مبيعاً</option>
                    <option value="price_asc">السعر: من الأقل للأعلى</option>
                    <option value="price_desc">السعر: من الأعلى للأقل</option>
                    <option value="rating_desc">الأعلى تقييماً</option>
                </select>
            </div>

            <div class="filter-section">
                <div class="filter-title">خيارات الشحن</div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-free-shipping"> شحن مجاني
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-fast-shipping"> شحن سريع (أقل من 10 أيام)
                    </label>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title">نطاق السعر</div>
                <div class="price-inputs">
                    <input type="number" id="min-price" placeholder="من">
                    <input type="number" id="max-price" placeholder="إلى">
                </div>
                <button id="apply-price" class="apply-btn">تطبيق السعر</button>
            </div>

            <div class="filter-section">
                <div class="filter-title">حالة المنتج</div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-promo"> يوجد عروض وخصومات
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-instock" checked> متوفر في المخزون
                    </label>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title">تقييم العملاء</div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="radio" name="rating" value="4"> <span class="rating-stars">★★★★☆</span> وأعلى
                    </label>
                    <label class="checkbox-label">
                        <input type="radio" name="rating" value="3"> <span class="rating-stars">★★★☆☆</span> وأعلى
                    </label>
                    <label class="checkbox-label">
                        <input type="radio" name="rating" value="0" checked> جميع التقييمات
                    </label>
                </div>
            </div>
        </aside>
        
        <div class="search-results-area">
            <div class="results-header">
                <h2 id="query-heading" style="margin: 0; font-size: 20px; font-weight: 900;">جاري البحث عن أفضل النتائج...</h2>
                <div class="view-toggle">
                    <button id="view-grid" class="active">
                        <svg style="width:18px;height:18px;vertical-align:middle" viewBox="0 0 24 24"><path fill="currentColor" d="M3,11H11V3H3M3,21H11V13H3M13,21H21V13H13M13,3V11H21V3"/></svg>
                    </button>
                    <button id="view-list">
                        <svg style="width:18px;height:18px;vertical-align:middle" viewBox="0 0 24 24"><path fill="currentColor" d="M3,4H21V8H3V4M3,10H21V14H3V10M3,16H21V20H3V16Z"/></svg>
                    </button>
                </div>
            </div>
            <main id="souq-widget-root"></main>
        </div>
    </div>
</div>

<div id="back-to-top">
    <a href="#" title="عد للأعلى">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"></path></svg>
    </a>
</div>

<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>
    
<script defer src='/public/js/controller.js'></script>  
<script defer src='/public/js/worker.js'></script>      
<script defer src='/public/js/corepress.js'></script>       
<script defer src='/public/js/search.js'></script>    

</body>
</html>
