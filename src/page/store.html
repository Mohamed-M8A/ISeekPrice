<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">    
<link href='/public/css/style.min.css' rel='stylesheet'/> 
<script defer src='/public/js/worker.js'></script>  
<script defer src='/public/js/controller.js'></script>  
<script defer src='/public/js/corepress.js'></script>    
<script defer src='/public/js/search.js'></script>
<title>المتجر - عرض المنتجات</title>
</head>
<body>

<header id='header' itemscope='itemscope' itemtype='https://schema.org/WPHeader'>
  <div class='header-main-row'>
    <div class='header-container'>
      <div class='logo' id='logo-wrap'></div>
      <div class='search-container' id='search-wrap'></div>
      <div class='header-actions' id='actions-wrap'></div>
    </div>
  </div>
<nav id='widget-topbar'></nav>
</header>
<div id='widget-sidebar'></div>
<div id='widget-overlay'></div>   

    <div id="seller-bar">
        <div class="bar">
            <img id="store-logo" src="/public/assets/static/store.webp" class="profile-image" alt="Store Logo">
            
            <div class="text" id="store-title">جاري تحميل المتجر...</div>

            <div class="store-stats" id="analytic-stats" style="display:none;">
                <div class="seller-stat-box">
                    <span class="seller-stat-label">المنتجات</span>
                    <span class="seller-stat-value" id="stat-count">0</span>
                </div>
                <div class="seller-stat-box">
                    <span class="seller-stat-label">التقييم</span>
                    <span class="seller-stat-value" id="stat-rating">0.0</span>
                </div>
                <div class="seller-stat-box">
                    <span class="seller-stat-label">المبيعات</span>
                    <span class="seller-stat-value" id="stat-sales">0</span>
                </div>
            </div>

            <div class="buttons">
                <a href="#" class="button" id="store-follow-btn">متابعة المتجر</a>
            </div>
        </div>
    </div>
<main><div id="souq-widget-root"></div></main>

<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>
    
    
<script>

async function initStorePage() {
    const params = new URLSearchParams(window.location.search);
    const storeId = params.get('store');
    if (!storeId) return;

    const cached = localStorage.getItem(`store_${storeId}`);
    if (cached) {
        const data = JSON.parse(cached);
        document.getElementById('store-title').innerText = data.name;
        document.getElementById('store-follow-btn').href = `https://s.click.aliexpress.com/${data.aff}`;
        document.title = `منتجات متجر ${data.name} - ISeekPrice`;
    }

    window.addEventListener('message', function handler(e) {
        if (e.data && e.data.type === 'BATCH' && e.data.batch.length > 0) {
            const firstProduct = e.data.batch[0];
            if (!localStorage.getItem(`store_${storeId}`) && firstProduct.recordIndex !== undefined) {
                fetchStoreMetadata(firstProduct.recordIndex, storeId);
                window.removeEventListener('message', handler);
            }
        }
        if (e.data && e.data.type === 'DONE') {
            calculateAnalytics(e.data.core, e.data.feed);
        }
    });

    if (typeof startWidget === "function") startWidget();
  }

async function fetchStoreMetadata(idx, storeId) {
    try {
        const mapRes = await fetch("https://data.iseekprice.com/General/map.json?v=" + Date.now());
        const map = await mapRes.json();
        const startByte = idx * 100;
        
        const res = await fetch(`https://data.iseekprice.com/General/links_${map.links}.bin`, {
            headers: { 'Range': `bytes=${startByte}-${startByte + 99}` }
        });

        if (res.status === 206) {
            const buf = await res.arrayBuffer();
            const decoder = new TextDecoder("utf-8");
            const storeAff = decoder.decode(new Uint8Array(buf, 30, 14)).replace(/\0/g, '').trim();
            const storeName = decoder.decode(new Uint8Array(buf, 44, 56)).replace(/\0/g, '').trim();

            document.getElementById('store-title').innerText = storeName;
            document.getElementById('store-follow-btn').href = `https://s.click.aliexpress.com/${storeAff}`;
            document.title = `منتجات متجر ${storeName} - ISeekPrice`;
            
            localStorage.setItem(`store_${storeId}`, JSON.stringify({ name: storeName, aff: storeAff }));
        }
    } catch (e) {}
}

function calculateAnalytics(core, feedMap) {
    if (!core || !feedMap) return;
    const productsCount = core.length;
    let totalSales = 0, totalScore = 0, ratedItems = 0;
    core.forEach(p => {
        const feed = feedMap[p.id];
        if (feed) {
            totalSales += (Number(feed.orders) || 0);
            if (feed.score > 0) {
                totalScore += Number(feed.score);
                ratedItems++;
            }
        }
    });
    const avgScore = ratedItems > 0 ? (totalScore / ratedItems).toFixed(1) : "5.0";
    document.getElementById('stat-count').innerText = productsCount;
    document.getElementById('stat-rating').innerText = avgScore;
    document.getElementById('stat-sales').innerText = totalSales.toLocaleString();
    document.getElementById('analytic-stats').style.display = 'flex';
}

window.addEventListener('load', initStorePage);  
        
</script>
</body>
</html>
