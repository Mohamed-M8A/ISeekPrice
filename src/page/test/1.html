<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض المنتجات التلقائي</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; }

        /* شبكة العرض */
        #products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* كارت المنتج */
        .product-card {
            background: white;
            border: 2px solid #ddd; /* الحواف اللي طلبتها */
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            text-align: center;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-card img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            height: 50px;
            overflow: hidden;
        }

        .product-link {
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        #status {
            text-align: center;
            font-weight: bold;
            color: #555;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>منتجات الموقع من السايت ماب</h1>
    <div id="status">جاري فحص السايت ماب...</div>
    
    <div id="products-grid">
        <!-- المنتجات هتنزل هنا آلياً -->
    </div>

    <script>
        async function startMining() {
            const status = document.getElementById('status');
            const grid = document.getElementById('products-grid');

            try {
                // 1. قراءة السايت ماب
                status.innerText = "جاري تحميل الـ Sitemap...";
                const response = await fetch('/sitemap.xml');
                const xmlText = await response.text();
                const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");

                // 2. استخراج الروابط اللي فيها product أو post
                const locs = Array.from(xmlDoc.getElementsByTagName("loc"));
                const productUrls = locs
                    .map(l => l.textContent)
                    .filter(url => url.includes('/product/') || url.includes('/post/'))
                    .slice(0, 3); // هنسحب أول 10 عشان التجربة.. شيل slice عشان تسحب كلو

                if (productUrls.length === 0) {
                    status.innerText = "لم يتم العثور على روابط مطابقة.";
                    return;
                }

                status.innerText = `تم العثور على ${productUrls.length} صفحة. جاري سحب البيانات...`;

                // 3. لفة على كل رابط وسحب محتواه
                for (const url of productUrls) {
                    try {
                        const res = await fetch(url);
                        const html = await res.text();
                        const doc = new DOMParser().parseFromString(html, "text/html");

                        // استخراج البيانات (عدل الـ Selectors حسب موقعك)
                        const title = doc.querySelector('h1')?.innerText || "عنوان غير متاح";
                        const img = doc.querySelector('img')?.src || "https://via.placeholder.com/150";

                        // 4. إنشاء الكارت وعرضه فوراً
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${img}" alt="${title}">
                            <div class="product-title">${title}</div>
                            <a href="${url}" class="product-link">عرض التفاصيل</a>
                        `;
                        grid.appendChild(card);
                    } catch (e) {
                        console.error("خطأ في سحب صفحة:", url);
                    }
                }

                status.innerText = "تم تحميل جميع البيانات بنجاح! ✅";

            } catch (error) {
                status.innerText = "حدث خطأ أثناء قراءة السايت ماب.";
                console.error(error);
            }
        }

        // ابدأ المهمة
        startMining();
    </script>
</body>
</html>
