<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - ISeekPrice</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">

    <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>
  
  <style>
    
:root{--navy:#001f3f;--border:#e2e8f0;--text:#334155}#primary{max-width:850px;margin:0 auto;padding:20px;background:#fff}.dark-mode #primary{background:#111827}.post-header{margin-bottom:30px;border-bottom:4px solid var(--navy);padding-bottom:15px}.post-header h1{font-size:2rem;color:var(--navy);margin:0}.dark-mode .post-header h1{color:#f1f5f9}#post-body{line-height:1.8;font-size:1.15rem;color:var(--text);display:block}.dark-mode #post-body{color:#cbd5e1}.post-image,#post-body img{display:block;width:100%;height:auto;max-height:500px;object-fit:cover;border-radius:4px;margin:25px 0;position:relative;z-index:1}#post-body p{margin-bottom:20px;text-align:justify}.meta-info{font-size:.9rem;color:#64748b;margin-bottom:10px}.main-share-button{background:var(--navy);color:#fff;border:none;padding:12px 25px;border-radius:2px;cursor:pointer;font-weight:700;width:100%}.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:20px}.rel-card{background:#fff;border:1px solid var(--border);border-bottom:3px solid var(--navy);text-decoration:none;color:inherit;border-radius:2px;overflow:hidden}.rel-card img{width:100%;height:140px;object-fit:cover}.rel-card h3{padding:10px;font-size:.95rem;margin:0}.dark-mode .rel-card{background:#1e293b;border-color:#334155;color:#f1f5f9}.tags span{transition:all .3s ease;cursor:pointer}.tags span:hover{background:#007bff!important;color:#fff!important}.toc-box{background:#f8fafc;border:1px solid var(--border);border-radius:4px;margin-bottom:25px;padding:15px}.dark-mode .toc-box{background:#1e293b}.toc-box summary{cursor:pointer;font-weight:700;color:var(--navy);outline:none;user-select:none}.dark-mode .toc-box summary{color:#f1f5f9}.toc-content{margin-top:10px;padding-right:20px}.toc-content ul{list-style:none;padding:0;margin:0}.toc-content li{margin-bottom:8px}.toc-content a{text-decoration:none;color:var(--text);font-size:1rem;transition:color .2s}.dark-mode .toc-content a{color:#cbd5e1}.toc-content a:hover{color:#007bff}.back-link{display:inline-flex;align-items:center;text-decoration:none;color:#64748b;font-size:.95rem;margin-bottom:20px;transition:color .2s}.back-link:hover{color:var(--navy)}.back-link::before{content:"→";margin-left:8px}
    
  </style>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>
</head>
<body>
  
<header id='header' itemscope='itemscope' itemtype='https://schema.org/WPHeader'>
  <div class='header-main-row'>
    <div class='header-container'>
      <div class='logo' id='logo-wrap'></div>
      <div class='search-container' id='search-wrap'></div>
      <div class='header-actions' id='actions-wrap'></div>
    </div>
  </div>
  <nav id='widget-topbar'></nav>
</header>

<div id='widget-sidebar'></div>
<div id='widget-overlay'></div>

  <div id="primary">
    <a href="/page/blog/" class="back-link">العودة للمدونة</a>
    
    <article id="single-content">
      <header class="post-header">
        <h1>{{ title }}</h1>
        <div class="meta-info">منشور في: {{ date | dateArabic }}</div>
      </header>

      <details class="toc-box" id="toc-container" style="display:none;">
        <summary>محتويات المقال (فهرس)</summary>
        <nav class="toc-content" id="toc-list"></nav>
      </details>

      <div id="post-body">
        {{ content }}
      </div>

      <div class="share-box-wrap" style="margin-top:30px;">
        <button id="shareOpenBtn" class="main-share-button">مشاركة المقال</button>
      </div>

      <div style="margin-top:60px;">
        <h2 style="color:var(--navy);font-size:1.4rem;border-right:5px solid var(--navy);padding-right:10px;margin-bottom:20px;">مقالات قد تهمك</h2>
        <div id="related-posts-root" class="related-grid"></div>
      </div>
    </article>
  </div>

  <footer id='footer'></footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const postBodyContainer = document.getElementById('post-body');
      const tocListContainer = document.getElementById('toc-list');
      const tocWrapper = document.getElementById('toc-container');
      
      if (postBodyContainer && tocListContainer && tocWrapper) {
        const articleHeadings = postBodyContainer.querySelectorAll('h2, h3');
        
        if (articleHeadings.length > 0) {
          tocWrapper.style.display = 'block';
          const listElement = document.createElement('ul');
          
          articleHeadings.forEach((heading, index) => {
            const headingId = 'section-link-' + index;
            heading.setAttribute('id', headingId);
            
            const listItem = document.createElement('li');
            if (heading.tagName === 'H3') {
              listItem.style.marginRight = '20px';
            }
            
            const anchorLink = document.createElement('a');
            anchorLink.href = '#' + headingId;
            anchorLink.textContent = heading.textContent;
            
            listItem.appendChild(anchorLink);
            listElement.appendChild(listItem);
          });
          
          tocListContainer.appendChild(listElement);
        }
      }
    });

    async function loadRelatedPosts() {
      const relatedRoot = document.getElementById('related-posts-root');
      const currentPath = window.location.pathname;
      
      if (!relatedRoot) return;
      
      try {
        const response = await fetch(`https://data.iseekprice.com/General/posts.json?v=${Date.now()}`);
        const allPosts = await response.json();
        
        const filteredPosts = allPosts
          .filter(post => !currentPath.includes(post.Url))
          .sort(() => 0.5 - Math.random())
          .slice(0, 3);
          
        relatedRoot.innerHTML = filteredPosts.map(post => `
          <a href="/post/${post.Url}" class="rel-card">
            <img src="${post.Img ? 'https://media.iseekprice.com/' + post.Img : '/public/assets/static/no-image.png'}">
            <h3>${post.Title}</h3>
          </a>
        `).join('');
      } catch (error) {
        relatedRoot.style.display = 'none';
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadRelatedPosts);
  </script>
</body>
</html>
