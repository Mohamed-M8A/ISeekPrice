<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - ISeekPrice</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <style>
    :root{--navy:#001f3f;--border:#e2e8f0;--text:#334155}
    #primary{max-width:850px;margin:0 auto;padding:20px;background:#fff}
    .dark-mode #primary{background:#111827}
    .post-header{margin-bottom:30px;border-bottom:4px solid var(--navy);padding-bottom:15px}
    .post-header h1{font-size:2rem;color:var(--navy);margin:0}
    .dark-mode .post-header h1{color:#f1f5f9}
    #post-body{line-height:1.8;font-size:1.15rem;color:var(--text);display:block}
    .dark-mode #post-body{color:#cbd5e1}
    .post-image, #post-body img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 500px;
        object-fit: cover;
        border-radius: 4px;
        margin: 25px 0;
        position: relative;
        z-index: 1;
    }
    #post-body p{margin-bottom:20px;text-align:justify}
    .meta-info{font-size:.9rem;color:#64748b;margin-bottom:10px}
    .main-share-button{background:var(--navy);color:#fff;border:none;padding:12px 25px;border-radius:2px;cursor:pointer;font-weight:700;width:100%}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:20px}
    .rel-card{background:#fff;border:1px solid var(--border);border-bottom:3px solid var(--navy);text-decoration:none;color:inherit;border-radius:2px;overflow:hidden}
    .rel-card img{width:100%;height:140px;object-fit:cover}
    .rel-card h3{padding:10px;font-size:.95rem;margin:0}.dark-mode .rel-card{background:#1e293b;border-color:#334155;color:#f1f5f9}
    
  </style>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>
</head>
<body>
  
  <header id="header">
    <div class="header-main-row">
        <div class="header-container">
            <div class="logo" id="logo-wrap"></div>
            <div class="search-container" id="search-wrap"></div>
            <div class="header-actions" id="actions-wrap"></div>
        </div>
    </div>
  </header>

  <div id="primary">
    <article id="single-content">
      <header class="post-header">
        <h1>{{ title }}</h1>
        <div class="meta-info">منشور في: {{ date | dateArabic }}</div>
      </header>

      <div id="post-body">
        {{ content }}
      </div>

      <div class="share-box-wrap" style="margin-top:30px;">
        <button id="shareOpenBtn" class="main-share-button">مشاركة المقال</button>
      </div>

      <div style="margin-top:60px;">
        <h2 style="color:var(--navy);font-size:1.4rem;border-right:5px solid var(--navy);padding-right:10px;margin-bottom:20px;">مقالات قد تهمك</h2>
        <div id="related-posts-root" class="related-grid"></div>
      </div>
    </article>
  </div>

  <footer id='footer'></footer>

  <script>
    async function loadRelated(){const r=document.getElementById('related-posts-root');const c=window.location.pathname;try{const s=await fetch(`https://data.iseekprice.com/General/posts.json?v=${Date.now()}`);let p=await s.json();const h=p.filter(x=>!c.includes(x.Url)).sort(()=>.5-Math.random()).slice(0,3);r.innerHTML=h.map(x=>`<a href="/post/${x.Url}" class="rel-card"><img src="${x.Img?'https://media.iseekprice.com/'+x.Img:'/public/assets/static/no-image.png'}"><h3>${x.Title}</h3></a>`).join('')}catch(e){r.style.display='none'}}
    document.addEventListener('DOMContentLoaded',loadRelated);
  </script>
</body>
</html>
