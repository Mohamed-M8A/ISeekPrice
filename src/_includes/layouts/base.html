<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.textContent = `#skuHubOverlay{position:fixed;inset:0;background:rgba(2,12,27,0.98);backdrop-filter:blur(15px);display:none;z-index:2147483647;justify-content:center;align-items:center;font-family:system-ui,sans-serif;direction:rtl}#skuHubOverlay.active{display:flex}.sku-container{width:90%;max-width:1100px;height:85vh;display:flex;flex-direction:column;animation:skuIn 0.5s cubic-bezier(0.16,1,0.3,1)}.sku-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid rgba(100,255,218,0.1)}.sku-title{color:#64ffda;font-size:1.1rem;letter-spacing:2px;font-weight:300}.sku-close{background:none;border:none;color:#8892b0;font-size:2.5rem;cursor:pointer}.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:30px 0;overflow-y:auto}.sku-card{background:#112240;border-radius:4px;overflow:hidden;cursor:pointer;transition:0.3s;border:1px solid transparent;display:flex;flex-direction:column}.sku-card:hover{border-color:#64ffda;transform:translateY(-5px)}.sku-img{width:100%;height:180px;object-fit:cover;opacity:0.8;transition:0.3s}.sku-card:hover .sku-img{opacity:1}.sku-content{padding:15px;flex-grow:1;display:flex;flex-direction:column}.sku-props{color:#8892b0;font-size:0.8rem;margin-bottom:10px;height:35px;overflow:hidden}.sku-price{display:flex;align-items:baseline;gap:10px}.sku-new{color:#ccd6f6;font-size:1.3rem;font-weight:600}.sku-old{color:#495670;font-size:0.8rem;text-decoration:line-through}.sku-footer{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;font-size:0.7rem;color:#64ffda;text-transform:uppercase}.sku-btn-main{display:none;width:100%;padding:14px;background:none;border:1px solid #64ffda;color:#64ffda;cursor:pointer;border-radius:4px;margin-top:15px;transition:0.3s;font-family:inherit}.sku-btn-main:hover{background:rgba(100,255,218,0.1)}@keyframes skuIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}`;
    document.head.appendChild(style);

    const hubHtml = `
        <div id="skuHubOverlay">
            <div class="sku-container">
                <div class="sku-header">
                    <div class="sku-title">SELECT VARIANT</div>
                    <button class="sku-close" onclick="window.SKU_HUB.toggle(false)">&times;</button>
                </div>
                <div class="sku-grid" id="skuHubGrid"></div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', hubHtml);

    window.SKU_HUB = {
        data: [],
        toggle: function(show) {
            document.getElementById('skuHubOverlay').classList.toggle('active', show);
            document.body.style.overflow = show ? 'hidden' : '';
        },
        render: function(list) {
            this.data = list.filter(i => i.priceDiscounted > 0);
            if (this.data.length === 0) return;

            const grid = document.getElementById('skuHubGrid');
            grid.innerHTML = this.data.map(item => `
                <div class="sku-card" onclick="window.SKU_HUB.select('${encodeURIComponent(JSON.stringify(item))}')">
                    <img src="${item.image}" class="sku-img" loading="lazy">
                    <div class="sku-content">
                        <div class="sku-props">${item.props}</div>
                        <div class="sku-price">
                            <span class="sku-new">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-footer">
                            <span>📦 Express Delivery</span>
                            <span>Save ${Math.round((item.priceOriginal-item.priceDiscounted)/item.priceOriginal*100)}%</span>
                        </div>
                    </div>
                </div>
            `).join('');

            this.injectButton();
        },
        injectButton: function() {
            const shelf = document.getElementById('dynamic-shelf');
            if (shelf && !document.getElementById('openSkuBtn')) {
                const btn = document.createElement('button');
                btn.id = 'openSkuBtn';
                btn.className = 'sku-btn-main';
                btn.textContent = 'استعراض كافة الخيارات والموديلات';
                btn.onclick = () => this.toggle(true);
                btn.style.display = 'block';
                shelf.appendChild(btn);
            }
        },
        select: function(enc) {
            const item = JSON.parse(decodeURIComponent(enc));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const imgs = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const idx = imgs.findIndex(i => i.src === item.image);
                if (idx !== -1) window.changeImage(idx);
            }
            this.toggle(false);
        }
    };

    // حلقة فحص ذكية لانتظار الكنترولر وربط البيانات
    let attempt = 0;
    const hookInterval = setInterval(() => {
        attempt++;
        if (typeof window.renderSKUs === 'function') {
            const originalRender = window.renderSKUs;
            window.renderSKUs = function(skuList) {
                originalRender(skuList); // تشغيل كودك الأصلي أولاً
                window.SKU_HUB.render(skuList); // تشغيل المستعرض الفخم
            };
            clearInterval(hookInterval);
        }
        if (attempt > 100) clearInterval(hookInterval); // توقف بعد 10 ثواني
    }, 100);

})();

  
</script>

</body>
</html>
