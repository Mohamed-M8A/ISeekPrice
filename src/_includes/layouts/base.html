<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.textContent = `
    #skuHubOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; z-index: 9999999; justify-content: center; align-items: center; font-family: 'Cairo', sans-serif; direction: rtl; }
    #skuHubOverlay.active { display: flex; }
    .sku-modal-content { width: 95%; max-width: 1000px; height: 85vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .dark-mode .sku-modal-content { background: #1a1a1a; color: #fff; border: 1px solid #333; }
    .sku-modal-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; }
    .dark-mode .sku-modal-header { background: #111; border-bottom: 1px solid #333; }
    .sku-modal-header h3 { margin: 0; font-size: 16px; color: #333; }
    .dark-mode .sku-modal-header h3 { color: #64ffda; }
    .sku-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; }
    .sku-grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; flex: 1; }
    .sku-item-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative; }
    .dark-mode .sku-item-card { background: #222; border-color: #333; }
    .sku-item-card:hover { border-color: #3498db; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .sku-item-img { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #eee; }
    .dark-mode .sku-item-img { border-bottom-color: #333; }
    .sku-item-details { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .sku-item-name { font-size: 12px; font-weight: 600; color: #64748b; height: 34px; overflow: hidden; }
    .dark-mode .sku-item-name { color: #8892b0; }
    .sku-item-pricing { display: flex; align-items: baseline; gap: 8px; }
    .sku-item-now { font-size: 18px; font-weight: 900; color: #059669; }
    .dark-mode .sku-item-now { color: #10b981; }
    .sku-item-old { font-size: 12px; color: #94a3b8; text-decoration: line-through; }
    .sku-item-shipping { font-size: 11px; display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid #f1f5f9; color: #64748b; }
    .dark-mode .sku-item-shipping { border-top-color: #333; color: #8892b0; }
    .sku-badge { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; color: #fff; z-index: 2; }
    .badge-best { background: #059669; }
    .badge-fast { background: #3b82f6; }
    .sku-trigger-wrap { width: 100%; display: flex; justify-content: center; margin-bottom: 15px; }
    .sku-mini-btn { background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569; padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; display: none; }
    .dark-mode .sku-mini-btn { background: #222; border-color: #333; color: #cbd5e1; }
    .sku-mini-btn:hover { background: #e2e8f0; color: #1e293b; }
    .dark-mode .sku-mini-btn:hover { background: #2d2d2d; color: #fff; }
    @media (max-width: 480px) { .sku-grid-view { grid-template-columns: repeat(2, 1fr); padding: 10px; gap: 10px; } .sku-item-img { height: 130px; } .sku-item-now { font-size: 15px; } }
    `.replace(/\s+/g, ' ');
    document.head.appendChild(style);

    const modalMarkup = `
        <div id="skuHubOverlay">
            <div class="sku-modal-content">
                <div class="sku-modal-header">
                    <h3>خيارات المنتج والموديلات</h3>
                    <button class="sku-close" onclick="window.SKU_MANAGER.toggle(false)">&times;</button>
                </div>
                <div id="skuHubGrid" class="sku-grid-view"></div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', modalMarkup);

    window.SKU_MANAGER = {
        variants: [],
        toggle: function(s) {
            document.getElementById('skuHubOverlay').classList.toggle('active', s);
            document.body.style.overflow = s ? 'hidden' : '';
        },
        render: function(data) {
            this.variants = data.filter(i => i.priceDiscounted > 0);
            if (!this.variants.length) return;

            const minPrice = Math.min(...this.variants.map(v => v.priceDiscounted));
            const minDelivery = Math.min(...this.variants.map(v => v.maxDelivery));

            const grid = document.getElementById('skuHubGrid');
            grid.innerHTML = this.variants.map(item => {
                let badge = "";
                if (item.priceDiscounted === minPrice) badge = '<span class="sku-badge badge-best">أقل سعر</span>';
                else if (item.maxDelivery === minDelivery) badge = '<span class="sku-badge badge-fast">الأسرع توصيلاً</span>';

                return `
                <div class="sku-item-card" onclick="window.SKU_MANAGER.select('${encodeURIComponent(JSON.stringify(item))}')">
                    ${badge}
                    <img src="${item.image}" class="sku-item-img" loading="lazy">
                    <div class="sku-item-details">
                        <div class="sku-item-name">${item.props}</div>
                        <div class="sku-item-pricing">
                            <span class="sku-item-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-item-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-item-shipping">
                            <span>🚚 ${item.maxDelivery} أيام</span>
                            <span>${item.shippingFee <= 0 ? 'شحن مجاني' : 'شحن: ' + item.shippingFee.toFixed(2)}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            this.injectTrigger();
        },
        injectTrigger: function() {
            const shelf = document.getElementById('dynamic-shelf');
            if (!shelf) return;
            const ref = shelf.querySelector('.info-boxes-wrapper');
            if (ref && !document.getElementById('skuMiniBtn')) {
                const wrap = document.createElement('div');
                wrap.className = 'sku-trigger-wrap';
                const btn = document.createElement('button');
                btn.id = 'skuMiniBtn';
                btn.className = 'sku-mini-btn';
                btn.textContent = 'استعراض كافة الموديلات';
                btn.style.display = 'block';
                btn.onclick = () => this.toggle(true);
                wrap.appendChild(btn);
                shelf.insertBefore(wrap, ref);
            }
        },
        select: function(enc) {
            const item = JSON.parse(decodeURIComponent(enc));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const th = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const i = th.findIndex(m => m.src === item.image);
                if (i !== -1) window.changeImage(i);
            }
            this.toggle(false);
        }
    };

    const run = () => {
        if (typeof window.renderSKUs === 'function') {
            const old = window.renderSKUs;
            window.renderSKUs = function(d) {
                old(d);
                window.SKU_MANAGER.render(d);
            };
            return true;
        }
        return false;
    };

    if (!run()) {
        const t = setInterval(() => { if (run()) clearInterval(t); }, 100);
        setTimeout(() => clearInterval(t), 5000);
    }
})();
  
</script>

</body>
</html>
