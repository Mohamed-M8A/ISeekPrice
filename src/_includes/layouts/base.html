<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const navyStyles = `#skuHubOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,25,47,0.98);backdrop-filter:blur(12px);display:none;z-index:1000000;justify-content:center;align-items:center;font-family:system-ui,-apple-system,sans-serif;direction:rtl}#skuHubOverlay *{box-sizing:border-box}.sku-hub-container{width:95%;max-width:1200px;height:90vh;display:flex;flex-direction:column;color:#e6f1ff}.sku-hub-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid rgba(100,255,218,0.1)}.sku-hub-title{font-size:1.5rem;font-weight:300;letter-spacing:1px;color:#64ffda}.sku-search-input{background:#112240;border:1px solid #233554;padding:12px 25px;border-radius:30px;color:#fff;width:300px;outline:none;transition:0.3s}.sku-search-input:focus{border-color:#64ffda;box-shadow:0 0 10px rgba(100,255,218,0.1)}.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding:30px 0;overflow-y:auto;flex-grow:1}.sku-card{background:#112240;border-radius:4px;overflow:hidden;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;border:1px solid transparent}.sku-card:hover{transform:translateY(-5px);background:#1d2d50;border-color:rgba(100,255,218,0.3)}.sku-card-img{width:100%;height:200px;object-fit:cover;opacity:0.9}.sku-card-body{padding:15px}.sku-card-props{font-size:0.85rem;color:#8892b0;margin-bottom:12px;line-height:1.4;height:40px;overflow:hidden}.sku-card-price-row{display:flex;align-items:center;gap:10px}.sku-card-now{font-size:1.4rem;font-weight:600;color:#ccd6f6}.sku-card-old{font-size:0.9rem;color:#495670;text-decoration:line-through}.sku-card-badge{position:absolute;top:10px;right:10px;background:rgba(100,255,218,0.1);color:#64ffda;padding:4px 12px;font-size:0.7rem;border-radius:2px;border:1px solid #64ffda}.close-btn{background:none;border:none;color:#8892b0;font-size:2rem;cursor:pointer;transition:0.2s}.close-btn:hover{color:#64ffda}.trigger-btn-fab{position:fixed;bottom:30px;right:30px;background:#64ffda;color:#0a192f;border:none;padding:16px 32px;border-radius:4px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px -10px rgba(100,255,218,0.3);z-index:999999;transition:0.3s}.trigger-btn-fab:hover{transform:translateY(-3px);box-shadow:0 20px 30px -15px rgba(100,255,218,0.5)}.sku-grid::-webkit-scrollbar{width:5px}.sku-grid::-webkit-scrollbar-track{background:#0a192f}.sku-grid::-webkit-scrollbar-thumb{background:#233554;border-radius:10px}`;

    const htmlLayout = `
        <button class="trigger-btn-fab" onclick="window.SKU_HUB.open()">استعراض الخيارات</button>
        <div id="skuHubOverlay">
            <div class="sku-hub-container">
                <div class="sku-hub-header">
                    <div class="sku-hub-title">SKU MASTER EXPLORER</div>
                    <input type="text" class="sku-search-input" id="skuHubSearch" placeholder="بحث في الموديلات...">
                    <button class="close-btn" onclick="window.SKU_HUB.close()">&times;</button>
                </div>
                <div id="skuHubGrid" class="sku-grid"></div>
            </div>
        </div>
    `;

    const styleElement = document.createElement('style');
    styleElement.innerHTML = navyStyles;
    document.head.appendChild(styleElement);

    const containerWrapper = document.createElement('div');
    containerWrapper.innerHTML = htmlLayout;
    document.body.appendChild(containerWrapper);

    window.SKU_HUB = {
        data: [],
        parse: function(buffer) {
            const view = new DataView(buffer);
            const decoder = new TextDecoder('utf-8');
            const results = [];
            const offsetStart = 8;

            for (let i = 0; i < 30; i++) {
                const ptr = offsetStart + (i * 214);
                const pOrig = view.getFloat32(ptr, true);
                
                if (pOrig > 0) {
                    const pDisc = view.getFloat32(ptr + 4, true);
                    const sFee = view.getFloat32(ptr + 8, true);
                    const delivery = `${view.getUint8(ptr + 12)}-${view.getUint8(ptr + 13)} يوم`;
                    
                    const imgB = new Uint8Array(buffer, ptr + 14, 40);
                    const slug = decoder.decode(imgB).replace(/\0/g, '').trim();
                    
                    const propB = new Uint8Array(buffer, ptr + 54, 160);
                    const props = decoder.decode(propB).replace(/\0/g, '').trim();

                    results.push({
                        priceOriginal: pOrig,
                        priceDiscounted: pDisc,
                        shippingFee: sFee,
                        delivery: delivery,
                        image: `https://ae01.alicdn.com/kf/${slug}.jpg`,
                        props: props,
                        discount: Math.round(((pOrig - pDisc) / pOrig) * 100)
                    });
                }
            }
            this.data = results;
            this.render(results);
        },
        render: function(list) {
            const grid = document.getElementById('skuHubGrid');
            grid.innerHTML = list.map(item => `
                <div class="sku-card" onclick="window.SKU_HUB.select('${encodeURIComponent(JSON.stringify(item))}')">
                    ${item.discount > 0 ? `<div class="sku-card-badge">توفير ${item.discount}%</div>` : ''}
                    <img class="sku-card-img" src="${item.image}" loading="lazy">
                    <div class="sku-card-body">
                        <div class="sku-card-props">${item.props}</div>
                        <div class="sku-card-price-row">
                            <span class="sku-card-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-card-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div style="font-size: 0.7rem; color: #64ffda; margin-top: 10px; display: flex; justify-content: space-between;">
                            <span>🚚 ${item.delivery}</span>
                            <span>${item.shippingFee <= 0 ? 'FREE SHIPPING' : 'SHIPPING: ' + item.shippingFee}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        },
        open: function() {
            document.getElementById('skuHubOverlay').style.display = 'flex';
            if(this.data.length === 0) this.mock();
        },
        close: function() {
            document.getElementById('skuHubOverlay').style.display = 'none';
        },
        select: function(encoded) {
            const item = JSON.parse(decodeURIComponent(encoded));
            if (window.injectData) window.injectData(item);
            this.close();
        },
        mock: function() {
            const dummy = Array.from({length: 12}, (_, i) => ({
                priceOriginal: 200,
                priceDiscounted: 150,
                shippingFee: 0,
                delivery: "10-15 يوم",
                image: "",
                props: "عينة تجريبية لموديل رقم " + (i + 1),
                discount: 25
            }));
            this.render(dummy);
        }
    };

    document.getElementById('skuHubSearch').addEventListener('input', function(e) {
        const q = e.target.value.toLowerCase();
        const filtered = window.SKU_HUB.data.filter(x => x.props.toLowerCase().includes(q));
        window.SKU_HUB.render(filtered);
    });
})();
  
</script>



  

</body>
</html>
