<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const css = `
        :root { --navy-deep: #0a192f; --navy-light: #112240; --mint: #64ffda; --slate: #8892b0; --white: #e6f1ff; }
        .sku-hub-trigger { display: none; margin-top: 15px; width: 100%; padding: 12px; background: none; border: 1px solid var(--mint); color: var(--mint); cursor: pointer; font-weight: 500; transition: 0.3s; border-radius: 4px; font-family: inherit; }
        .sku-hub-trigger.visible { display: block; }
        .sku-hub-trigger:hover { background: rgba(100,255,218,0.1); }
        #skuOverlay { position: fixed; inset: 0; background: rgba(10,25,47,0.95); backdrop-filter: blur(10px); z-index: 999999; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        #skuOverlay.active { display: flex; opacity: 1; }
        .sku-modal { width: 95%; max-width: 1100px; height: 85vh; display: flex; flex-direction: column; position: relative; animation: skuFade 0.4s ease forwards; }
        @keyframes skuFade { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sku-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sku-title { color: var(--mint); font-size: 1.2rem; font-weight: 300; text-transform: uppercase; letter-spacing: 2px; }
        .sku-close { background: none; border: none; color: var(--slate); font-size: 2rem; cursor: pointer; transition: 0.2s; }
        .sku-close:hover { color: var(--white); }
        .sku-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 25px 0; overflow-y: auto; flex-grow: 1; scrollbar-width: thin; }
        .sku-grid::-webkit-scrollbar { width: 4px; }
        .sku-grid::-webkit-scrollbar-thumb { background: var(--navy-light); }
        .sku-item { background: var(--navy-light); border-radius: 2px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid transparent; display: flex; flex-direction: column; }
        .sku-item:hover { border-color: var(--mint); transform: translateY(-3px); }
        .sku-img { width: 100%; height: 160px; object-fit: cover; filter: grayscale(20%); transition: 0.3s; }
        .sku-item:hover .sku-img { filter: grayscale(0%); }
        .sku-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .sku-props { font-size: 0.8rem; color: var(--slate); margin-bottom: 10px; line-height: 1.4; height: 35px; overflow: hidden; }
        .sku-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: auto; }
        .sku-p-new { color: var(--white); font-size: 1.2rem; font-weight: 600; }
        .sku-p-old { color: var(--slate); font-size: 0.8rem; text-decoration: line-through; }
        .sku-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--mint); margin-top: 10px; opacity: 0.8; }
    `;

    const style = document.createElement('style');
    style.textContent = css.replace(/\s+/g, ' ');
    document.head.appendChild(style);

    const modalHtml = `
        <div id="skuOverlay">
            <div class="sku-modal">
                <div class="sku-header">
                    <span class="sku-title">Models Explorer</span>
                    <button class="sku-close" onclick="SKU_CORE.close()">&times;</button>
                </div>
                <div class="sku-grid" id="skuGrid"></div>
            </div>
        </div>
    `;

    const div = document.createElement('div');
    div.innerHTML = modalHtml;
    document.body.appendChild(div);

    const injectTrigger = () => {
        const shelf = document.getElementById('dynamic-shelf');
        if (shelf && !document.getElementById('skuBtn')) {
            const btn = document.createElement('button');
            btn.id = 'skuBtn';
            btn.className = 'sku-hub-trigger';
            btn.textContent = 'استعراض كافة الموديلات';
            btn.onclick = () => SKU_CORE.open();
            shelf.appendChild(btn);
        }
    };

    window.SKU_CORE = {
        list: [],
        open: function() {
            document.getElementById('skuOverlay').classList.add('active');
        },
        close: function() {
            document.getElementById('skuOverlay').classList.remove('active');
        },
        render: function(data) {
            this.list = data.filter(i => i.priceDiscounted > 0);
            const grid = document.getElementById('skuGrid');
            const btn = document.getElementById('skuBtn');
            
            if (btn && this.list.length > 0) btn.classList.add('visible');

            grid.innerHTML = this.list.map(item => `
                <div class="sku-item" onclick="SKU_CORE.select('${encodeURIComponent(JSON.stringify(item))}')">
                    <img class="sku-img" src="${item.image}" loading="lazy">
                    <div class="sku-info">
                        <div class="sku-props">${item.props}</div>
                        <div class="sku-price-row">
                            <span class="sku-p-new">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-p-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-meta">
                            <span>🚚 ${item.maxDelivery}d</span>
                            <span>${item.shippingFee <= 0 ? 'FREE' : item.shippingFee.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        },
        select: function(enc) {
            const item = JSON.parse(decodeURIComponent(enc));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const thumbs = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const idx = thumbs.findIndex(img => img.src === item.image);
                if (idx !== -1) window.changeImage(idx);
            }
            this.close();
        }
    };

    window.renderSKUs = function(skuList) {
        SKU_CORE.render(skuList);
    };

    const observer = new MutationObserver(() => {
        if (document.getElementById('dynamic-shelf')) {
            injectTrigger();
            observer.disconnect();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
})();
  
</script>



  

</body>
</html>
