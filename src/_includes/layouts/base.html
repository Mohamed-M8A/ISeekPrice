<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.innerHTML = `
        :root {
            --navy: #0f172a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        #sku-hub-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            z-index: 1000000;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            direction: rtl;
        }
        .sku-hub-wrapper {
            background: var(--bg);
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .sku-hub-header {
            padding: 20px 30px;
            background: var(--navy);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sku-hub-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
        }
        .sku-hub-grid {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .sku-item-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .sku-item-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .sku-item-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .sku-item-body {
            padding: 15px;
            flex-grow: 1;
        }
        .sku-item-props {
            font-size: 0.875rem;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sku-item-price {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .sku-price-now {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--navy);
        }
        .sku-price-old {
            font-size: 0.875rem;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .sku-item-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
        }
        .close-sku-hub {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .sku-open-trigger {
            background: var(--navy);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 0;
            transition: opacity 0.2s;
        }
    `;
    document.head.appendChild(style);

    const container = document.createElement('div');
    container.innerHTML = `
        <div id="sku-hub-overlay">
            <div class="sku-hub-wrapper">
                <div class="sku-hub-header">
                    <h3 class="sku-hub-title">الموديلات المتوفرة</h3>
                    <button class="close-sku-hub" onclick="SKU_CORE.hide()">&times;</button>
                </div>
                <div id="sku-hub-grid" class="sku-hub-grid"></div>
            </div>
        </div>
    `;
    document.body.appendChild(container);

    window.SKU_CORE = {
        data: [],
        parse: function(buffer) {
            const view = new DataView(buffer);
            const decoder = new TextDecoder('utf-8');
            const items = [];
            for (let i = 0; i < 30; i++) {
                let offset = 8 + (i * 214);
                if (offset + 214 > buffer.byteLength) break;
                const original = view.getFloat32(offset, true);
                const discounted = view.getFloat32(offset + 4, true);
                if (original <= 0) continue;
                const shipping = view.getFloat32(offset + 8, true);
                const minD = view.getUint8(offset + 12);
                const maxD = view.getUint8(offset + 13);
                const imgSlug = decoder.decode(new Uint8Array(buffer, offset + 14, 40)).replace(/\0/g, '').trim();
                const props = decoder.decode(new Uint8Array(buffer, offset + 54, 160)).replace(/\0/g, '').trim();
                items.push({
                    priceOriginal: original,
                    priceDiscounted: discounted,
                    shippingFee: shipping,
                    minDelivery: minD,
                    maxDelivery: maxD,
                    image: `https://ae01.alicdn.com/kf/${imgSlug}.jpg`,
                    props: props
                });
            }
            this.data = items;
            this.render();
        },
        render: function() {
            const grid = document.getElementById('sku-hub-grid');
            grid.innerHTML = this.data.map((item, idx) => `
                <div class="sku-item-card" onclick="SKU_CORE.select(${idx})">
                    <img src="${item.image}" class="sku-item-img" loading="lazy">
                    <div class="sku-item-body">
                        <div class="sku-item-props">${item.props}</div>
                        <div class="sku-item-price">
                            <span class="sku-price-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-price-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-item-footer">
                            <span>🚚 ${item.maxDelivery} يوم</span>
                            <span>${item.shippingFee <= 0 ? 'شحن مجاني' : 'شحن: ' + item.shippingFee}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        },
        select: function(index) {
            const item = this.data[index];
            if (window.injectData) window.injectData(item);
            if (window.changeImage) {
                const images = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const match = images.findIndex(img => img.src === item.image);
                if (match !== -1) window.changeImage(match);
            }
            this.hide();
        },
        show: function() {
            document.getElementById('sku-hub-overlay').style.display = 'flex';
        },
        hide: function() {
            document.getElementById('sku-hub-overlay').style.display = 'none';
        },
        injectTrigger: function(targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;
            const btn = document.createElement('button');
            btn.className = 'sku-open-trigger';
            btn.innerText = 'استعراض كافة الموديلات';
            btn.onclick = () => this.show();
            target.appendChild(btn);
        }
    };
})();

  
</script>



  

</body>
</html>
