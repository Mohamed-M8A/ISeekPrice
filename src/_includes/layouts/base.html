<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.textContent = `
    #skuHubOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); display: none; z-index: 9999999; justify-content: center; align-items: center; font-family: 'Cairo', sans-serif; direction: rtl; }
    #skuHubOverlay.active { display: flex; }
    .sku-modal-content { width: 95%; max-width: 1100px; background: #fff; border-radius: 12px; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.4); padding: 25px; overflow: hidden; }
    .dark-mode .sku-modal-content { background: #1a1a1a; border: 1px solid #333; color: #fff; }
    
    .sku-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    .dark-mode .sku-modal-header { border-bottom-color: #333; }
    .sku-modal-header h3 { margin: 0; font-size: 18px; font-weight: 800; color: #1e293b; }
    .dark-mode .sku-modal-header h3 { color: #64ffda; }
    
    .sku-close { background: #f1f5f9; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .sku-close:hover { background: #e2e8f0; color: #000; }
    .dark-mode .sku-close { background: #333; color: #fff; }

    .sku-slider-container { position: relative; display: flex; align-items: center; width: 100%; padding: 0 10px; }
    .sku-track { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding: 15px 5px; scrollbar-width: none; -ms-overflow-style: none; }
    .sku-track::-webkit-scrollbar { display: none; }

    .sku-card { min-width: 280px; max-width: 280px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; position: relative; flex-shrink: 0; }
    .dark-mode .sku-card { background: #222; border-color: #333; }
    
    /* الهوفر المطلوب: حدود سوداء وتأثير عمق بسيط بدون حركة */
    .sku-card:hover { border-color: #000; box-shadow: 0 0 0 1px #000, 0 10px 25px rgba(0,0,0,0.1); }
    .dark-mode .sku-card:hover { border-color: #64ffda; box-shadow: 0 0 0 1px #64ffda; }

    .sku-card-img-wrap { width: 100%; height: 200px; background: #f8fafc; overflow: hidden; border-bottom: 1px solid #eee; }
    .sku-card-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.5s ease; }
    .sku-card:hover .sku-card-img { transform: scale(1.05); }

    .sku-card-info { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .sku-card-name { font-size: 14px; color: #475569; font-weight: 700; height: 40px; overflow: hidden; line-height: 1.5; }
    .dark-mode .sku-card-name { color: #cbd5e1; }

    .sku-card-pricing { display: flex; align-items: baseline; gap: 10px; }
    .sku-card-now { font-size: 22px; font-weight: 900; color: #000; }
    .dark-mode .sku-card-now { color: #fff; }
    .sku-card-old { font-size: 14px; color: #94a3b8; text-decoration: line-through; }

    .sku-card-meta { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #f1f5f9; padding-top: 12px; font-size: 12px; color: #64748b; }
    .dark-mode .sku-card-meta { border-top-color: #333; color: #94a3b8; }
    
    .meta-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .meta-row svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    .sku-badge { position: absolute; top: 12px; right: 12px; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #fff; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .badge-price { background: #10b981; }
    .badge-delivery { background: #3b82f6; }

    .sku-nav { position: absolute; width: 45px; height: 45px; background: #fff; border: 1px solid #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; color: #1e293b; }
    .dark-mode .sku-nav { background: #1a1a1a; border-color: #333; color: #fff; }
    .sku-nav:hover { background: #000; color: #fff; border-color: #000; }
    .sku-nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; }
    
    /* عكس الاتجاهات */
    .sku-nav.prev { right: -22px; }
    .sku-nav.next { left: -22px; }

    .sku-trigger-wrap { width: 100%; display: flex; justify-content: center; margin: 15px 0; }
    .sku-btn-minimal { background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; padding: 12px 30px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .dark-mode .sku-btn-minimal { background: #222; border-color: #333; color: #94a3b8; }
    .sku-btn-minimal:hover { background: #000; color: #fff; border-color: #000; }

    @media (max-width: 768px) { 
        .sku-nav { display: none; } 
        .sku-track { padding: 10px 0; gap: 15px; } 
        .sku-card { min-width: 250px; }
    }
    `.replace(/\s+/g, ' ');
    document.head.appendChild(style);

    const markup = `
        <div id="skuHubOverlay">
            <div class="sku-modal-content">
                <div class="sku-modal-header">
                    <h3>خيارات وموديلات المنتج</h3>
                    <button class="sku-close" onclick="window.SKU_HUB.toggle(false)">&times;</button>
                </div>
                <div class="sku-slider-container">
                    <button class="sku-nav prev" onclick="window.SKU_HUB.scroll('right')">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                    <div class="sku-track" id="skuTrack"></div>
                    <button class="sku-nav next" onclick="window.SKU_HUB.scroll('left')">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', markup);

    window.SKU_HUB = {
        items: [],
        toggle: function(s) {
            document.getElementById('skuHubOverlay').classList.toggle('active', s);
            document.body.style.overflow = s ? 'hidden' : '';
        },
        scroll: function(dir) {
            const track = document.getElementById('skuTrack');
            const amt = 300;
            // في RTL الـ scrollLeft يحتاج معالجة بسيطة
            track.scrollBy({ left: dir === 'left' ? -amt : amt, behavior: 'smooth' });
        },
        render: function(data) {
            this.items = data.filter(i => i.priceDiscounted > 0);
            if (!this.items.length) return;

            const minP = Math.min(...this.items.map(v => v.priceDiscounted));
            const minD = Math.min(...this.items.map(v => v.maxDelivery));

            const track = document.getElementById('skuTrack');
            track.innerHTML = this.items.map(item => {
                let badge = "";
                if (item.priceDiscounted === minP) badge = '<span class="sku-badge badge-price">أفضل سعر</span>';
                else if (item.maxDelivery === minD) badge = '<span class="sku-badge badge-delivery">أسرع شحن</span>';

                return `
                <div class="sku-card" onclick="window.SKU_HUB.select('${encodeURIComponent(JSON.stringify(item))}')">
                    ${badge}
                    <div class="sku-card-img-wrap">
                        <img src="${item.image}" class="sku-card-img" loading="lazy">
                    </div>
                    <div class="sku-card-info">
                        <div class="sku-card-name">${item.props}</div>
                        <div class="sku-card-pricing">
                            <span class="sku-card-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-card-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-card-meta">
                            <div class="meta-row">
                                <svg viewBox="0 0 24 24"><path d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                                <span>التوصيل: ${item.minDelivery}-${item.maxDelivery} يوم</span>
                            </div>
                            <div class="meta-row" style="color: ${item.shippingFee <= 0 ? '#10b981' : 'inherit'}">
                                <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v4m0 0l8 4m-8-4l-8 4m0-4v10l8 4"/></svg>
                                <span>${item.shippingFee <= 0 ? 'شحن مجاني بالكامل' : 'رسوم الشحن: ' + item.shippingFee.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            this.initBtn();
        },
        initBtn: function() {
            const shelf = document.getElementById('dynamic-shelf');
            if (!shelf) return;
            const boxes = shelf.querySelector('.info-boxes-wrapper');
            if (boxes && !document.getElementById('skuHubBtn')) {
                const wrap = document.createElement('div');
                wrap.className = 'sku-trigger-wrap';
                const btn = document.createElement('button');
                btn.id = 'skuHubBtn';
                btn.className = 'sku-btn-minimal';
                btn.textContent = 'خيارات الموديلات والأسعار';
                btn.style.display = 'block';
                btn.onclick = () => this.toggle(true);
                wrap.appendChild(btn);
                shelf.insertBefore(wrap, boxes);
            }
        },
        select: function(enc) {
            const item = JSON.parse(decodeURIComponent(enc));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const imgs = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const idx = imgs.findIndex(i => i.src === item.image);
                if (idx !== -1) window.changeImage(idx);
            }
            this.toggle(false);
        }
    };

    const boot = () => {
        if (typeof window.renderSKUs === 'function') {
            const origin = window.renderSKUs;
            window.renderSKUs = (d) => { origin(d); window.SKU_HUB.render(d); };
            return true;
        }
        return false;
    };

    if (!boot()) {
        const int = setInterval(() => { if (boot()) clearInterval(int); }, 100);
        setTimeout(() => clearInterval(int), 8000);
    }
})();
  
</script>

</body>
</html>
