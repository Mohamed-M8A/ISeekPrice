<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const markup = `
        <div id="skuHubOverlay">
            <div class="sku-modal-content">
                <div class="sku-modal-header">
                    <h3>خيارات وموديلات المنتج</h3>
                    <button class="sku-close" onclick="window.SKU_HUB.toggle(false)">&times;</button>
                </div>
                <div class="sku-slider-container">
                    <button class="sku-nav prev" onclick="window.SKU_HUB.scroll('right')">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                    <div class="sku-track" id="skuTrack"></div>
                    <button class="sku-nav next" onclick="window.SKU_HUB.scroll('left')">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', markup);

    window.SKU_HUB = {
        items: [],
        
        toggle: function(show) {
            const overlay = document.getElementById('skuHubOverlay');
            if (overlay) {
                overlay.classList.toggle('active', show);
                document.body.style.overflow = show ? 'hidden' : '';
            }
        },

        scroll: function(direction) {
            const track = document.getElementById('skuTrack');
            if (track) {
                const scrollAmount = 300;
                track.scrollBy({ 
                    left: direction === 'left' ? -scrollAmount : scrollAmount, 
                    behavior: 'smooth' 
                });
            }
        },

        render: function(data) {
            this.items = data.filter(i => i.priceDiscounted > 0);
            if (!this.items.length) return;

            const minPrice = Math.min(...this.items.map(v => v.priceDiscounted));
            const minDelivery = Math.min(...this.items.map(v => v.maxDelivery));

            const track = document.getElementById('skuTrack');
            track.innerHTML = this.items.map(item => {
                let badge = "";
                if (item.priceDiscounted === minPrice) {
                    badge = '<span class="sku-badge badge-price">أفضل سعر</span>';
                } else if (item.maxDelivery === minDelivery) {
                    badge = '<span class="sku-badge badge-delivery">أسرع شحن</span>';
                }

                return `
                <div class="sku-card" onclick="window.SKU_HUB.select('${encodeURIComponent(JSON.stringify(item))}')">
                    ${badge}
                    <div class="sku-card-img-wrap">
                        <img src="${item.image}" class="sku-card-img" loading="lazy">
                    </div>
                    <div class="sku-card-info">
                        <div class="sku-card-name">${item.props}</div>
                        <div class="sku-card-pricing">
                            <span class="sku-card-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-card-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-card-meta">
                            <div class="meta-row">
                                <svg viewBox="0 0 24 24"><path d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                                <span>التوصيل: ${item.minDelivery}-${item.maxDelivery} يوم</span>
                            </div>
                            <div class="meta-row" style="color: ${item.shippingFee <= 0 ? '#10b981' : 'inherit'}">
                                <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v4m0 0l8 4m-8-4l-8 4m0-4v10l8 4"/></svg>
                                <span>${item.shippingFee <= 0 ? 'شحن مجاني بالكامل' : 'رسوم الشحن: ' + item.shippingFee.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            this.initTriggerButton();
        },

        initTriggerButton: function() {
            const boxes = document.querySelector('.info-boxes-wrapper');
            if (boxes && !document.getElementById('skuHubBtn')) {
                const wrap = document.createElement('div');
                wrap.className = 'sku-trigger-wrap';
                
                const btn = document.createElement('button');
                btn.id = 'skuHubBtn';
                btn.className = 'sku-btn-minimal';
                btn.textContent = 'خيارات الموديلات والأسعار';
                btn.style.display = 'block';
                btn.onclick = () => this.toggle(true);
                
                wrap.appendChild(btn);
                boxes.parentNode.insertBefore(wrap, boxes);
            }
        },

        select: function(encodedData) {
            const item = JSON.parse(decodeURIComponent(encodedData));
            
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            
            if (window.changeImage) {
                const thumbnails = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const targetIndex = thumbnails.findIndex(img => img.src === item.image);
                if (targetIndex !== -1) window.changeImage(targetIndex);
            }
            
            this.toggle(false);
        }
    };

    const bootstrap = () => {
        if (typeof window.renderSKUs === 'function') {
            const originalFunction = window.renderSKUs;
            window.renderSKUs = function(skuData) {
                originalFunction(skuData);
                window.SKU_HUB.render(skuData);
            };
            return true;
        }
        return false;
    };

    if (!bootstrap()) {
        const interval = setInterval(() => {
            if (bootstrap()) clearInterval(interval);
        }, 100);
        setTimeout(() => clearInterval(interval), 8000);
    }
})();
  
</script>

</body>
</html>
