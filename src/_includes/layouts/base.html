<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.textContent = `
    #skuHubOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); display: none; z-index: 9999999; justify-content: center; align-items: center; font-family: 'Cairo', sans-serif; direction: rtl; }
    #skuHubOverlay.active { display: flex; }
    .sku-modal-content { width: 95%; max-width: 1100px; background: #fff; border-radius: 16px; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); padding: 20px; overflow: hidden; }
    .dark-mode .sku-modal-content { background: #1a1a1a; border: 1px solid #333; color: #fff; }
    .sku-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sku-modal-header h3 { margin: 0; font-size: 16px; color: #1e293b; }
    .dark-mode .sku-modal-header h3 { color: #64ffda; }
    .sku-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .dark-mode .sku-close { background: #333; color: #fff; }
    .sku-slider-container { position: relative; display: flex; align-items: center; width: 100%; }
    .sku-track { display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 5px; scrollbar-width: none; -ms-overflow-style: none; }
    .sku-track::-webkit-scrollbar { display: none; }
    .sku-card { min-width: 260px; max-width: 260px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; position: relative; flex-shrink: 0; }
    .dark-mode .sku-card { background: #222; border-color: #333; }
    .sku-card:hover { transform: translateY(-5px); border-color: #3498db; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .sku-card-img { width: 100%; height: 180px; object-fit: cover; }
    .sku-card-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .sku-card-name { font-size: 13px; color: #64748b; font-weight: 600; height: 38px; overflow: hidden; line-height: 1.4; }
    .dark-mode .sku-card-name { color: #94a3b8; }
    .sku-card-pricing { display: flex; align-items: baseline; gap: 10px; }
    .sku-card-now { font-size: 20px; font-weight: 900; color: #059669; }
    .sku-card-old { font-size: 13px; color: #94a3b8; text-decoration: line-through; }
    .sku-card-meta { display: flex; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 10px; font-size: 11px; color: #475569; }
    .dark-mode .sku-card-meta { border-top-color: #333; color: #94a3b8; }
    .sku-badge { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; color: #fff; z-index: 5; }
    .badge-price { background: #059669; }
    .badge-delivery { background: #3b82f6; }
    .sku-nav { position: absolute; width: 40px; height: 40px; background: #fff; border: 1px solid #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
    .dark-mode .sku-nav { background: #333; border-color: #444; color: #fff; }
    .sku-nav:hover { background: #3498db; color: #fff; border-color: #3498db; }
    .sku-nav.prev { right: -20px; }
    .sku-nav.next { left: -20px; }
    .sku-trigger-wrap { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
    .sku-btn-grey { background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; display: none; }
    .dark-mode .sku-btn-grey { background: #1e1e1e; border-color: #333; color: #94a3b8; }
    .sku-btn-grey:hover { background: #e2e8f0; color: #1e293b; }
    @media (max-width: 768px) { .sku-nav { display: none; } .sku-track { padding: 10px 0; } .sku-card { min-width: 220px; } .sku-nav.prev { right: 0; } .sku-nav.next { left: 0; } }
    `.replace(/\s+/g, ' ');
    document.head.appendChild(style);

    const markup = `
        <div id="skuHubOverlay">
            <div class="sku-modal-content">
                <div class="sku-modal-header">
                    <h3>جميع الخيارات المتاحة</h3>
                    <button class="sku-close" onclick="window.SKU_HUB.toggle(false)">&times;</button>
                </div>
                <div class="sku-slider-container">
                    <button class="sku-nav prev" onclick="window.SKU_HUB.scroll('right')">❯</button>
                    <div class="sku-track" id="skuTrack"></div>
                    <button class="sku-nav next" onclick="window.SKU_HUB.scroll('left')">❮</button>
                </div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', markup);

    window.SKU_HUB = {
        items: [],
        toggle: function(s) {
            document.getElementById('skuHubOverlay').classList.toggle('active', s);
            document.body.style.overflow = s ? 'hidden' : '';
        },
        scroll: function(dir) {
            const track = document.getElementById('skuTrack');
            const amt = 280;
            track.scrollLeft += (dir === 'left' ? -amt : amt);
        },
        render: function(data) {
            this.items = data.filter(i => i.priceDiscounted > 0);
            if (!this.items.length) return;

            const minP = Math.min(...this.items.map(v => v.priceDiscounted));
            const minD = Math.min(...this.items.map(v => v.maxDelivery));

            const track = document.getElementById('skuTrack');
            track.innerHTML = this.items.map(item => {
                let badge = "";
                if (item.priceDiscounted === minP) badge = '<span class="sku-badge badge-price">الأفضل سعراً</span>';
                else if (item.maxDelivery === minD) badge = '<span class="sku-badge badge-delivery">الأسرع شحناً</span>';

                return `
                <div class="sku-card" onclick="window.SKU_HUB.select('${encodeURIComponent(JSON.stringify(item))}')">
                    ${badge}
                    <img src="${item.image}" class="sku-card-img" loading="lazy">
                    <div class="sku-card-info">
                        <div class="sku-card-name">${item.props}</div>
                        <div class="sku-card-pricing">
                            <span class="sku-card-now">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-card-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-card-meta">
                            <span>🚚 التوصيل: ${item.maxDelivery} أيام</span>
                            <span>${item.shippingFee <= 0 ? 'شحن مجاني' : 'الشحن: ' + item.shippingFee.toFixed(2)}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            this.initBtn();
        },
        initBtn: function() {
            const shelf = document.getElementById('dynamic-shelf');
            if (!shelf) return;
            const boxes = shelf.querySelector('.info-boxes-wrapper');
            if (boxes && !document.getElementById('skuHubBtn')) {
                const wrap = document.createElement('div');
                wrap.className = 'sku-trigger-wrap';
                const btn = document.createElement('button');
                btn.id = 'skuHubBtn';
                btn.className = 'sku-btn-grey';
                btn.textContent = 'استعراض كافة الخيارات والموديلات';
                btn.style.display = 'block';
                btn.onclick = () => this.toggle(true);
                wrap.appendChild(btn);
                shelf.insertBefore(wrap, boxes);
            }
        },
        select: function(enc) {
            const item = JSON.parse(decodeURIComponent(enc));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const imgs = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const idx = imgs.findIndex(i => i.src === item.image);
                if (idx !== -1) window.changeImage(idx);
            }
            this.toggle(false);
        }
    };

    const boot = () => {
        if (typeof window.renderSKUs === 'function') {
            const origin = window.renderSKUs;
            window.renderSKUs = (d) => { origin(d); window.SKU_HUB.render(d); };
            return true;
        }
        return false;
    };

    if (!boot()) {
        const int = setInterval(() => { if (boot()) clearInterval(int); }, 100);
        setTimeout(() => clearInterval(int), 6000);
    }
})();

  
</script>

</body>
</html>
