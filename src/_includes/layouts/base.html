<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" type="image/x-icon" href="/public/assets/static/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="/public/js/make.js" defer></script>
  <script src="/public/js/worker.js" defer></script>
  <script src="/public/js/controller.js" defer></script>
  <script src="/public/js/corepress.js" defer></script>
  <script src="/public/js/search.js" defer></script>

   <!-- Google tag (gtag.js) -->
    <script async src='https://www.googletagmanager.com/gtag/js?id=G-FRWKEMXVYT'></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRWKEMXVYT');
    </script>

<script type="application/ld+json" id="product-json-ld">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ title }}",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "SAR",
    "availability": "https://schema.org/InStock",
    "price": "0.00"
  }
}
</script>
  
</head>
<body>

  <header id="header" itemscope itemtype="https://schema.org/WPHeader">
    <div class="header-main-row">
      <div class="header-container">
        <div class="logo" id="logo-wrap"></div>
        <div class="search-container" id="search-wrap"></div>
        <div class="header-actions" id="actions-wrap"></div>
      </div>
    </div>
    <nav id="widget-topbar"></nav>
  </header>


<div id="primary">
    <article id="single-content">
        <div id="post-body">
            <hr class="clean-divider">
            {{ content }}
        </div>
        <hr class="clean-divider">
        <div class="share-box-wrap">
            <button id="shareOpenBtn" class="main-share-button">
                مشاركة مع الأصدقاء
            </button>
        </div>
        <hr class="clean-divider">
        <p>عروض ستعجبك</p>
        <div id="souq-widget-root"></div>
    </article>
</div>


<footer id='footer' itemscope='itemscope' itemtype='https://schema.org/WPFooter'></footer>


  <div id="widget-sidebar"></div>
  <div id="widget-overlay"></div>


<script>

(function() {
    const style = document.createElement('style');
    style.textContent = `#skuHubOverlay{position:fixed;inset:0;background:rgba(2,12,27,0.99);backdrop-filter:blur(20px);display:none;z-index:2147483647;justify-content:center;align-items:center;font-family:system-ui,-apple-system,sans-serif;direction:rtl}#skuHubOverlay.active{display:flex}.sku-wrapper{width:92%;max-width:1200px;height:88vh;display:flex;flex-direction:column;animation:skuReveal 0.4s cubic-bezier(0.16,1,0.3,1)}@keyframes skuReveal{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}.sku-header{display:flex;justify-content:space-between;align-items:center;padding:0 10px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.05)}.sku-title{color:#64ffda;font-size:0.9rem;font-weight:400;letter-spacing:3px;text-transform:uppercase}.sku-close-btn{background:none;border:none;color:#8892b0;font-size:2.2rem;cursor:pointer;line-height:1}.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:30px 10px;overflow-y:auto;flex-grow:1;scrollbar-width:thin;scrollbar-color:#233554 #020c1b}.sku-grid::-webkit-scrollbar{width:4px}.sku-grid::-webkit-scrollbar-thumb{background:#233554}.sku-card{background:#112240;border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s ease;border:1px solid rgba(100,255,218,0);display:flex;flex-direction:column;position:relative}.sku-card:hover{transform:translateY(-8px);border-color:rgba(100,255,218,0.4);box-shadow:0 15px 35px rgba(0,0,0,0.4)}.sku-card-img{width:100%;height:220px;object-fit:cover;transition:0.5s}.sku-card-content{padding:18px;display:flex;flex-direction:column;gap:12px}.sku-card-props{color:#ccd6f6;font-size:0.85rem;font-weight:500;line-height:1.5;height:40px;overflow:hidden}.sku-card-price-box{display:flex;align-items:center;gap:12px}.sku-card-new{color:#fff;font-size:1.5rem;font-weight:700}.sku-card-old{color:#495670;font-size:0.9rem;text-decoration:line-through}.sku-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);font-size:0.75rem}.sku-delivery-tag{color:#64ffda;display:flex;align-items:center;gap:5px}.sku-shipping-tag{color:#8892b0}.sku-open-trigger{width:100%;padding:14px;background:#f0f2f5;border:1px solid #dcdfe6;color:#495670;font-weight:600;font-size:0.95rem;border-radius:8px;cursor:pointer;margin:15px 0;transition:0.2s;display:none;text-align:center;font-family:inherit}.sku-open-trigger:hover{background:#e4e7ed;color:#2c3e50;border-color:#c0c4cc}`;
    document.head.appendChild(style);

    const modalMarkup = `
        <div id="skuHubOverlay">
            <div class="sku-wrapper">
                <div class="sku-header">
                    <div class="sku-title">Product Variants Explorer</div>
                    <button class="sku-close-btn" onclick="window.SKU_MANAGER.toggle(false)">&times;</button>
                </div>
                <div id="skuHubGrid" class="sku-grid"></div>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', modalMarkup);

    window.SKU_MANAGER = {
        store: [],
        toggle: function(state) {
            const el = document.getElementById('skuHubOverlay');
            el.classList.toggle('active', state);
            document.body.style.overflow = state ? 'hidden' : '';
        },
        render: function(list) {
            this.store = list.filter(i => i.priceDiscounted > 0);
            if (!this.store.length) return;

            const grid = document.getElementById('skuHubGrid');
            grid.innerHTML = this.store.map(item => `
                <div class="sku-card" onclick="window.SKU_MANAGER.select('${encodeURIComponent(JSON.stringify(item))}')">
                    <img src="${item.image}" class="sku-card-img" loading="lazy">
                    <div class="sku-card-content">
                        <div class="sku-card-props">${item.props}</div>
                        <div class="sku-card-price-box">
                            <span class="sku-card-new">${item.priceDiscounted.toFixed(2)}</span>
                            <span class="sku-card-old">${item.priceOriginal.toFixed(2)}</span>
                        </div>
                        <div class="sku-card-footer">
                            <span class="sku-delivery-tag">🚚 ${item.maxDelivery} Days Delivery</span>
                            <span class="sku-shipping-tag">${item.shippingFee <= 0 ? 'FREE SHIPPING' : 'SHIPPING: ' + item.shippingFee.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            this.placeButton();
        },
        placeButton: function() {
            const shelf = document.getElementById('dynamic-shelf');
            if (!shelf) return;
            const target = shelf.querySelector('.info-boxes-wrapper') || shelf.querySelector('.button-container');
            if (target && !document.getElementById('skuMainAction')) {
                const btn = document.createElement('button');
                btn.id = 'skuMainAction';
                btn.className = 'sku-open-trigger';
                btn.textContent = 'استعراض كافة الموديلات والأسعار المتوفرة';
                btn.onclick = () => this.toggle(true);
                btn.style.display = 'block';
                shelf.insertBefore(btn, target);
            }
        },
        select: function(data) {
            const item = JSON.parse(decodeURIComponent(data));
            if (window.updateSKUPrice) window.updateSKUPrice(item);
            if (window.changeImage) {
                const gallery = Array.from(document.querySelectorAll('.thumbnails-slider img'));
                const found = gallery.findIndex(img => img.src === item.image);
                if (found !== -1) window.changeImage(found);
            }
            this.toggle(false);
        }
    };

    const syncWithController = () => {
        if (typeof window.renderSKUs === 'function') {
            const coreFunc = window.renderSKUs;
            window.renderSKUs = function(data) {
                coreFunc(data);
                window.SKU_MANAGER.render(data);
            };
            return true;
        }
        return false;
    };

    if (!syncWithController()) {
        const poller = setInterval(() => {
            if (syncWithController()) clearInterval(poller);
        }, 100);
        setTimeout(() => clearInterval(poller), 10000);
    }
})();

  
</script>

</body>
</html>
