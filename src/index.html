<script type='text/javascript'>
    
const aliData = [
  {t: "أفضل الصفقات العالمية", d: "ملايين المنتجات بأسعار المصنع مباشرة"},
  {t: "شحن سريع وموثوق", d: "اطلب الآن واستمتع بتجربة تسوق فريدة"},
  {t: "وفر الكثير مع علي إكسبريس", d: "خصومات حصرية تصل إلى 70% على الإلكترونيات"}
];

let aliIdx = 0;
const aliTitle = document.getElementById('ali-title');
const aliDesc = document.getElementById('ali-desc');

function rotateAliContent() {
  aliTitle.style.opacity = aliDesc.style.opacity = 0;
  
  setTimeout(() => {
    aliIdx = (aliIdx + 1) % aliData.length;
    aliTitle.innerText = aliData[aliIdx].t;
    aliDesc.innerText = aliData[aliIdx].d;
    aliTitle.style.opacity = aliDesc.style.opacity = 1;
  }, 500);
}

aliTitle.style.transition = aliDesc.style.transition = "opacity 0.5s ease-in-out";
setInterval(rotateAliContent, 4000);
    
</script>
