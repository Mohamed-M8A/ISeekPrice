<script type='text/javascript'>
    
const promoSlides = [
  {t: "أفضل الصفقات العالمية بين يديك", d: "اكتشف منتجات علي إكسبريس المختارة بعناية لأجلك"},
  {t: "وفّر حتى 70% على الإلكترونيات", d: "عروض حصرية لفترة محدودة من كبار البائعين"},
  {t: "تسوق مباشر من المصنع", d: "ضمان أقل الأسعار مع شحن سريع وآمن لجميع الوجهات"}
];

let promoIdx = 0;
const titleEl = document.getElementById('promo-title');
const descEl = document.getElementById('promo-desc');

function updatePromoContent() {
  titleEl.style.opacity = descEl.style.opacity = '0';
  
  setTimeout(() => {
    promoIdx = (promoIdx + 1) % promoSlides.length;
    titleEl.innerText = promoSlides[promoIdx].t;
    descEl.innerText = promoSlides[promoIdx].d;
    titleEl.style.opacity = descEl.style.opacity = '1';
  }, 450);
}

setInterval(updatePromoContent, 6000);
    
</script>
