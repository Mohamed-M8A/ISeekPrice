<script type='text/javascript'>
    
const slides = [
  {t: "وفر أموالك مع أفضل صفقات اليوم", d: "منتجات مختارة من علي إكسبرس بأسعار تنافسية"},
  {t: "أحدث التقنيات بأسعار المصنع", d: "اكتشف تشكيلة واسعة من الإلكترونيات الذكية"},
  {t: "تسوق بذكاء.. تسوق مباشرة", d: "خصومات تصل إلى 70% مع حماية كاملة للمشتري"}
];

let currentIndex = 0;
const titleNode = document.getElementById('rotating-title'),
      descNode = document.getElementById('rotating-desc');

function rotateTexts() {
  titleNode.style.opacity = descNode.style.opacity = '0';
  
  setTimeout(() => {
    currentIndex = (currentIndex + 1) % slides.length;
    titleNode.innerText = slides[currentIndex].t;
    descNode.innerText = slides[currentIndex].d;
    titleNode.style.opacity = descNode.style.opacity = '1';
  }, 400);
}

titleNode.style.transition = descNode.style.transition = "opacity 0.4s ease";
setInterval(rotateTexts, 5000);
    
</script>
