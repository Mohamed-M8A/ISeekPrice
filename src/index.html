<script type='text/javascript'>
    
const content = [
    {b:"عروض حصرية", t:"أفضل المنتجات العالمية بأسعار المصنع", d:"اكتشف تشكيلة واسعة من الإلكترونيات والأزياء بأفضل سعر"},
    {b:"شحن سريع", t:"تسوق من علي إكسبريس واحمِ محفظتك", d:"خصومات مذهلة لفترة محدودة على جميع الأقسام"},
    {b:"الأكثر مبيعاً", t:"ملايين المنتجات تنتظر اكتشافك", d:"ضمان استعادة الأموال وحماية كاملة للمشتري"}
];

let i = 0;
const b = document.getElementById('hero-badge'),
      t = document.getElementById('hero-title'),
      d = document.getElementById('hero-desc');

function updateHero() {
    [b, t, d].forEach(el => el.style.opacity = 0);
    setTimeout(() => {
        i = (i + 1) % content.length;
        b.innerText = content[i].b;
        t.innerText = content[i].t;
        d.innerText = content[i].d;
        [b, t, d].forEach(el => el.style.opacity = 1);
    }, 600);
}

[b, t, d].forEach(el => el.style.transition = "all 0.6s ease-in-out");
setInterval(updateHero, 5000);
    
</script>
